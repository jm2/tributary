# ── Library root trust ──────────────────────────────────────────────
library_root_trust:
  legacy_heading: "このライブラリフォルダーを信頼しますか？"
  legacy_body: "Tributary は %{path} 以下の %{count} 曲を記憶していますが、このフォルダーはライブラリの同一性確認が導入される前に設定されたものです。以前使用していたものと同じライブラリである場合にのみ信頼してください。それまでの間、Tributary は保存済みのメタデータを保持しますが、このフォルダーの変更をインデックスに反映したり、見つからない曲をライブラリから削除したりはしません。信頼が確立された後は、後続の完全な照合によって、引き続き見つからない記憶済みの曲が削除される場合があります。"
  replacement_heading: "ライブラリフォルダーの同一性が変更されました"
  replacement_body: "%{path} にあるフォルダーを、Tributary が以前信頼していたライブラリ（記憶済みの曲：%{count} 曲）として確認できませんでした。そのライブラリを意図的に置き換えたか移動した場合にのみ、このフォルダーを使用してください。信頼が確立されるまで、Tributary は記憶済みのメタデータを保持します。後続の完全な照合によって、このフォルダーに引き続き存在しない曲が削除される場合があります。"
  empty_new_heading: "このライブラリフォルダーをセットアップしますか？"
  empty_new_body: "Tributary は %{path} 以下にサポートされているオーディオファイルを見つけられませんでした。新しい空のライブラリである可能性もありますが、リムーバブルドライブやネットワーク共有がマウントされていないことを示している場合もあります。ここが意図したライブラリの場所である場合にのみ続行してください。"
  empty_heading: "サポートされているオーディオファイルが見つかりません"
  empty_body: "Tributary は %{path} 以下にサポートされているオーディオファイルを見つけられませんでしたが、そこにある %{count} 曲を記憶しています。リムーバブルドライブやネットワーク共有がマウントされていない可能性があります。ここが意図したライブラリのボリュームであり、サポートされているオーディオファイルが意図的に存在しない場合にのみ続行してください。"
  empty_new_final_heading: "このライブラリの場所で間違いありませんか？"
  empty_new_final_body: "現在、%{path} 以下にサポートされているオーディオファイルは表示されていません。ここがマウントされていないドライブやネットワーク共有ではなく、意図したライブラリの場所であることを確認してください。今後の完全なスキャンでは、ここで追加または削除されたファイルが反映されます。Tributary がオーディオファイル自体を削除することはありません。"
  empty_final_heading: "それでもこのライブラリフォルダーを信頼しますか？"
  empty_final_body: "現在、%{path} 以下にサポートされているオーディオファイルは表示されていません。このパスは意図したライブラリではなく、何もマウントされていないマウントポイントにすぎない可能性があります。登録時のスキャンでは記憶済みの %{count} 曲がすべて保持されますが、後続の完全な確定スキャンによって、このフォルダーに引き続き存在しない記憶済みの曲がすべて削除される場合があります。Tributary がオーディオファイル自体を削除することはありません。"
  not_now: "後で"
  keep_existing: "既存のライブラリを維持"
  trust_folder: "フォルダーを信頼"
  use_folder: "このフォルダーを使用"
  review_empty_risk: "リスクを確認"
  trust_empty_anyway: "それでもフォルダーを信頼"
  pending_toast: "信頼する前にライブラリフォルダーを確認しています…"
  trusted_toast: "ライブラリフォルダーを信頼し、有効にしました。"
  replacement_trusted_toast: "新しいライブラリフォルダーを信頼し、有効にしました。"
  empty_trusted_toast: "ライブラリフォルダーを信頼し、有効にしました。"
  unavailable_toast: "フォルダーが利用できないか、スキャンが完了しなかったため、信頼を確立できませんでした。記憶済みのメタデータは引き続き保護されています。"
  stale_toast: "信頼の確立が完了する前にフォルダーが変更されました。フォルダーは引き続き利用できず、記憶済みのメタデータは保護されたままです。"
