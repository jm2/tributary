  disclosure_title: "Tributary mit Last.fm verbinden"
  disclosure_body: "Tributary kann die von Ihnen gespielten Titel an Last.fm übermitteln. Jede Übermittlung enthält Interpret und Titel des Stücks und kann außerdem Album, Albuminterpret, Titelnummer, Dauer und die UTC-Zeit des Wiedergabebeginns enthalten. Last.fm verknüpft diese Angaben mit dem verbundenen Konto und kann sie für Hörverlauf, Charts und Empfehlungen veröffentlichen oder verwenden.\n\nQualifizierte Offline-Übermittlungen werden auf diesem Computer gespeichert, bis sie zugestellt werden, Sie die Verbindung trennen oder sie ausdrücklich löschen.\n\nVerbundene Musikserver können dieselbe Wiedergabe unabhängig scrobbeln, daher sind alle entfernten Katalogquellen zunächst vom Scrobbling ausgenommen. Ausgabeserver oder Empfänger – insbesondere MPD-Installationen mit eigenem Scrobbler – können ebenfalls unabhängig übermitteln. Tributary kann solche externen Integrationen nicht erkennen; das Ausschließen entfernter Quellen verringert doppelte Übermittlungen daher, kann sie aber nicht ganz verhindern."
