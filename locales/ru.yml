# ── Library root trust ──────────────────────────────────────────────
library_root_trust:
  legacy_heading: "Доверять этой папке медиатеки?"
  legacy_body: "Tributary хранит сведения о треках в %{path} (запомненных треков: %{count}), но эта папка была добавлена до появления проверок идентичности медиатеки. Доверяйте ей, только если это та же медиатека, которой вы пользовались раньше. До тех пор сохранённые метаданные остаются нетронутыми, но Tributary не будет индексировать изменения и удалять из медиатеки отсутствующие треки этой папки. После установления доверия последующая полная сверка может удалить запомненные треки, которые по-прежнему отсутствуют."
  replacement_heading: "Идентичность папки медиатеки изменилась"
  replacement_body: "Не удалось подтвердить, что папка %{path} — это медиатека, которой Tributary доверял ранее (запомненных треков: %{count}). Используйте эту папку, только если вы намеренно заменили или переместили ту медиатеку. Пока устанавливается доверие, Tributary сохраняет запомненные метаданные; последующая полная сверка может удалить треки, которые по-прежнему отсутствуют в этой папке."
  empty_new_heading: "Настроить эту папку медиатеки?"
  empty_new_body: "Tributary не нашёл поддерживаемых аудиофайлов в %{path}. Возможно, это новая пустая медиатека, но это также может означать, что съёмный диск или сетевой ресурс не смонтирован. Продолжайте, только если это и есть нужное расположение медиатеки."
  empty_heading: "Поддерживаемые аудиофайлы не найдены"
  empty_body: "Tributary не нашёл поддерживаемых аудиофайлов в %{path}, но хранит сведения о треках в этом расположении (запомненных треков: %{count}). Это может означать, что съёмный диск или сетевой ресурс не смонтирован. Продолжайте, только если это нужный том медиатеки и поддерживаемые аудиофайлы на нём отсутствуют намеренно."
  empty_new_final_heading: "Подтвердить это расположение медиатеки?"
  empty_new_final_body: "Сейчас в %{path} не видно поддерживаемых аудиофайлов. Подтвердите, что это нужное расположение медиатеки, а не несмонтированный диск или сетевой ресурс. Будущие полные сканирования будут учитывать файлы, добавленные сюда или удалённые отсюда; Tributary никогда не удаляет сами аудиофайлы."
  empty_final_heading: "Всё равно доверять этой папке медиатеки?"
  empty_final_body: "Сейчас в %{path} не видно поддерживаемых аудиофайлов. Возможно, этот путь — лишь пустая точка монтирования без смонтированного тома, а не нужная медиатека. Сканирование при регистрации сохраняет все запомненные треки (%{count}), но последующее полное окончательное сканирование может удалить каждый запомненный трек, который по-прежнему отсутствует в этой папке. Tributary никогда не удаляет сами аудиофайлы."
  not_now: "Не сейчас"
  keep_existing: "Оставить текущую медиатеку"
  trust_folder: "Доверять папке"
  use_folder: "Использовать эту папку"
  review_empty_risk: "Оценить риск"
  trust_empty_anyway: "Всё равно доверять папке"
  pending_toast: "Проверка папки медиатеки перед установлением доверия…"
  trusted_toast: "Папка медиатеки отмечена как доверенная и активна."
  replacement_trusted_toast: "Новая папка медиатеки отмечена как доверенная и активна."
  empty_trusted_toast: "Папка медиатеки отмечена как доверенная и активна."
  unavailable_toast: "Не удалось установить доверие: папка недоступна или её сканирование не было завершено. Запомненные метаданные остаются защищёнными."
  stale_toast: "Папка изменилась до того, как удалось установить доверие. Она остаётся недоступной, а запомненные метаданные — защищёнными."
  failed_toast: "Tributary не удалось завершить установление доверия к этой папке медиатеки. Она остаётся недоступной, а запомненные метаданные — защищёнными."

