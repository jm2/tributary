  connect: "Подключить…"
  reconnect: "Переподключить…"
  disconnect: "Отключить…"
  disclosure_title: "Подключение Tributary к Last.fm"
  disclosure_body: "Tributary может отправлять в Last.fm сведения о прослушанных треках. Каждая отправка содержит исполнителя и название трека и может также включать альбом, исполнителя альбома, номер трека, длительность и время начала воспроизведения по UTC. Last.fm связывает эти сведения с подключённой учётной записью и может публиковать или использовать их для истории прослушивания, чартов и рекомендаций.\n\nПодходящие отправки, сделанные без сети, хранятся на этом компьютере, пока не будут доставлены, пока вы не отключитесь или пока вы явно их не удалите.\n\nПодключённые музыкальные серверы могут самостоятельно скробблить то же воспроизведение, поэтому все удалённые источники каталога изначально исключены из скробблинга. Серверы или приёмники вывода, особенно установки MPD с собственным скробблером, тоже могут отправлять данные самостоятельно. Tributary не может обнаружить такие внешние интеграции, поэтому исключение удалённых источников уменьшает количество повторных отправок, но не может полностью их устранить."
  accept: "Принять и включить"
  decline: "Не сейчас"
  finish_title: "Ожидание подтверждения Last.fm"
  finish_body: "Подтвердите подключение в браузере, а затем нажмите «Продолжить», чтобы завершить подключение Tributary."
  cancel: "Отмена"
