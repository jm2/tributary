  disclosure_title: "Połącz Tributary z Last.fm"
  disclosure_body: "Tributary może wysyłać do Last.fm odtwarzane utwory. Każde zgłoszenie zawiera wykonawcę i tytuł utworu, a może też zawierać album, wykonawcę albumu, numer utworu, czas trwania oraz czas UTC rozpoczęcia odtwarzania. Last.fm wiąże te informacje z połączonym kontem i może je publikować lub wykorzystywać w historii słuchania, listach przebojów i rekomendacjach.\n\nKwalifikujące się zgłoszenia offline są przechowywane na tym komputerze, dopóki nie zostaną dostarczone, nie rozłączysz konta lub nie usuniesz ich wprost.\n\nPołączone serwery muzyczne mogą niezależnie scrobblować to samo odtwarzanie, dlatego wszystkie zdalne źródła katalogów są początkowo wyłączone ze scrobblowania. Serwery lub odbiorniki wyjściowe, zwłaszcza instalacje MPD z własnym scrobblerem, również mogą wysyłać zgłoszenia niezależnie. Tributary nie wykrywa takich zewnętrznych integracji, więc wyłączenie zdalnych źródeł ogranicza zduplikowane zgłoszenia, ale nie może ich całkowicie wyeliminować."
