# ── Library root trust ──────────────────────────────────────────────
library_root_trust:
  legacy_heading: "Zaufać temu folderowi biblioteki?"
  legacy_body: "Tributary pamięta utwory w %{path} (liczba: %{count}), ale ten folder pochodzi sprzed wprowadzenia kontroli tożsamości biblioteki. Zaufaj mu tylko wtedy, gdy jest to ta sama biblioteka, która była używana wcześniej. Do tego czasu Tributary zachowuje zapisane metadane, ale nie będzie indeksować zmian ani usuwać z biblioteki brakujących utworów z tego folderu. Po ustanowieniu zaufania późniejsze pełne uzgodnienie może usunąć zapamiętane utwory, których nadal brakuje."
  replacement_heading: "Zmieniła się tożsamość folderu biblioteki"
  replacement_body: "Nie udało się potwierdzić, że folder %{path} to biblioteka, której Tributary wcześniej ufał i która ma zapamiętane utwory (liczba: %{count}). Użyj tego folderu tylko wtedy, gdy celowo zastąpiono lub przeniesiono tę bibliotekę. Podczas ustanawiania zaufania Tributary zachowuje zapamiętane metadane; późniejsze pełne uzgodnienie może usunąć utwory, których nadal brakuje w tym folderze."
  empty_new_heading: "Skonfigurować ten folder biblioteki?"
  empty_new_body: "Tributary nie znalazł obsługiwanych plików audio w %{path}. Może to być nowa, pusta biblioteka, ale może to też oznaczać, że dysk wymienny lub udział sieciowy nie jest zamontowany. Kontynuuj tylko wtedy, gdy jest to zamierzona lokalizacja biblioteki."
  empty_heading: "Nie znaleziono obsługiwanych plików audio"
  empty_body: "Tributary nie znalazł obsługiwanych plików audio w %{path}, ale pamięta utwory w tym miejscu (liczba: %{count}). Może to oznaczać, że dysk wymienny lub udział sieciowy nie jest zamontowany. Kontynuuj tylko wtedy, gdy jest to zamierzony wolumin biblioteki, a brak obsługiwanych plików audio jest celowy."
  empty_new_final_heading: "Potwierdzić tę lokalizację biblioteki?"
  empty_new_final_body: "W %{path} nie są obecnie widoczne żadne obsługiwane pliki audio. Potwierdź, że jest to zamierzona lokalizacja biblioteki, a nie niezamontowany dysk lub udział sieciowy. Przyszłe pełne skanowania uwzględnią pliki dodane tu lub stąd usunięte; Tributary nigdy nie usuwa samych plików audio."
  empty_final_heading: "Mimo to zaufać temu folderowi biblioteki?"
  empty_final_body: "W %{path} nie są obecnie widoczne żadne obsługiwane pliki audio. Ta ścieżka może być jedynie pustym punktem montowania bez zamontowanego woluminu, a nie zamierzoną biblioteką. Skanowanie rejestracyjne zachowuje wszystkie zapamiętane utwory (%{count}), ale późniejsze pełne, wiążące skanowanie może usunąć każdy zapamiętany utwór, którego nadal brakuje w tym folderze. Tributary nigdy nie usuwa samych plików audio."
  not_now: "Nie teraz"
  keep_existing: "Zachowaj obecną bibliotekę"
  trust_folder: "Zaufaj folderowi"
  use_folder: "Użyj tego folderu"
  review_empty_risk: "Sprawdź ryzyko"
  trust_empty_anyway: "Mimo to zaufaj folderowi"
  pending_toast: "Sprawdzanie folderu biblioteki przed ustanowieniem zaufania…"
  trusted_toast: "Folder biblioteki jest zaufany i aktywny."
  replacement_trusted_toast: "Nowy folder biblioteki jest zaufany i aktywny."
  empty_trusted_toast: "Folder biblioteki jest zaufany i aktywny."
  unavailable_toast: "Nie udało się ustanowić zaufania, ponieważ folder jest niedostępny lub jego skanowanie nie zostało ukończone. Zapamiętane metadane pozostają chronione."
