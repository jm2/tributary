  disclosure_title: "Tributary verbinden met Last.fm"
  disclosure_body: "Tributary kan de nummers die u afspeelt naar Last.fm verzenden. Elke inzending bevat de artiest en titel van het nummer en kan ook het album, de albumartiest, het tracknummer, de duur en het UTC-tijdstip waarop het afspelen begon bevatten. Last.fm koppelt deze gegevens aan het account dat u verbindt en kan ze publiceren of gebruiken voor luistergeschiedenis, hitlijsten en aanbevelingen.\n\nGeldige offline inzendingen worden op deze computer bewaard totdat ze zijn afgeleverd, u de verbinding verbreekt of u ze uitdrukkelijk verwijdert.\n\nMuziekservers waarmee u verbinding maakt, kunnen hetzelfde afspelen zelfstandig scrobbelen. Daarom zijn alle externe catalogusbronnen standaard uitgesloten van scrobbelen. Uitvoerservers of ontvangers, vooral MPD-installaties met een eigen scrobbler, kunnen ook zelfstandig inzenden. Tributary kan zulke externe koppelingen niet detecteren, dus het uitsluiten van externe bronnen vermindert dubbele inzendingen, maar kan ze niet volledig voorkomen."
