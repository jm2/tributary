name: Bot review gate publisher

# The required `Bot Review Gate` check: machine-readable merge evidence for
# the repository's all-green policy, published exclusively from trusted
# default-branch content.
#
# Why this workflow exists in this shape: `pull_request`-triggered workflows
# execute the pull request's merge-ref revision, so a gate that evaluated and
# published from `.github/workflows/bot-review-gate.yml` would run
# pull-request-controlled content under the required check name — a pull
# request could replace the run block with a no-op and satisfy the context
# from the legitimate GitHub Actions integration. This companion is instead
# triggered by the `workflow_run` event fired by the Bot review gate
# announcer workflow, and GitHub ALWAYS executes a `workflow_run` workflow's
# default-branch revision. A pull request therefore cannot alter the
# evaluation or publication logic below; tampering with the announcer can
# only suppress the refresh. A refresh that dies before publishing is not
# fail-safe by itself, though: check runs attach to the head SHA and the
# LATEST completed run under the required name decides, so a head that
# already carries a green verdict would keep it across a dead refresh. The
# publisher therefore never exits without publishing at a known head: every
# discovery-level refusal — a failed discovery query, an announcement with
# no candidate pull request, an announcement whose every candidate was
# skipped — publishes the SUPERSEDING failing verdict at the announced head
# before exiting. (An unreported required check blocks the merge only at a
# head that has never been evaluated.) Fail-closed by construction,
# without `pull_request_target`.
#
# The check fails while, at one exact pull-request head commit, any of the
# following holds:
#   1. a review thread started by a bot (a GitHub App account or a
#      "[bot]"-suffixed login) is not explicitly resolved — including threads
#      GitHub marks outdated, because code movement is not evidence that a
#      finding was addressed;
#   2. a bot reviewer's latest decisive review requests changes: only a
#      CHANGES_REQUESTED, APPROVED or DISMISSED review carries a conclusion,
#      so a comment-only review never clears an outstanding change request,
#      and that request blocks even when it opened no inline thread;
#   3. a bot reviewer's latest review predates the head being evaluated:
#      bot-review evidence must be bound to the exact commit being merged.
#      A formal dismissal clears the dismissed conclusion, but it does not
#      exempt reviews submitted afterwards from this head binding. Whether
#      a review is "after the dismissal" is decided against the recorded
#      dismissal time from the review timeline: a dismissal mutates the
#      dismissed review in place and keeps its database ID, so review IDs
#      alone cannot order evidence around a dismissal, and reviews
#      submitted before the dismissal are cleared with it;
#   4. a bot reviewer has a review still in PENDING state: a pending review
#      is an attempt in flight, and while it exists none of the author's
#      earlier conclusions count at this head — even an approval already
#      bound to the exact head stops counting until the pending attempt is
#      submitted or discarded, and the block is bound to the attempt's
#      database ID and its commit so the report names exactly what is in
#      flight;
#   5. a trusted expected reviewer has no review on the pull request at
#      all. In-scope is fixed by enumeration, not observation: the
#      EXPECTED_BOT_REVIEWERS list below (default-branch content, grown only
#      by the reviewed change that enables each bot) names every review
#      integration the repository requires on every pull request, and a
#      listed identity with zero reviews — an outage, a rate limit, a
#      rename — fails closed exactly like a rejected review, threads or no
#      threads. The only sanctioned waiver is the operator-documented
#      substitution below.
#   6. a trusted expected reviewer carries an outstanding re-review
#      request — the pull request's API-visible `requested_reviewers`
#      list — that no submitted review at the evaluated head
#      acknowledges AFTER the request was made. A re-review request is
#      an attempt in flight, and until a review is submitted at this
#      head in response to it, it invalidates that reviewer's earlier
#      clean result here: the prior approval stops counting. The
#      handshake is attempt-bound through the review-request timeline
#      events (the same trusted, API-visible evidence class as review
#      dismissals): the request must be superseded by an at-head review
#      submitted after the latest request event for that reviewer —
#      and a request that POSTDATES every at-head review keeps the gate
#      red even though the reviewer's older at-head approval still
#      stands, because that older approval cannot acknowledge a request
#      it predates. The bot-owned, attempt-bound acknowledgment signal
#      the policy document describes is coordinator/operator design
#      scope and is deliberately not invented from an untrusted source;
#      this API-visible half fails closed in the meantime.
#
# Semantics:
#   * Only explicit thread resolution or a formal review dismissal clears a
#     finding. A human reply inside a thread does not, and GitHub's
#     "outdated" flag does not either.
#   * The gate performs no review and never approves anything: it reports
#     whether machine-readable bot-review evidence is clean at the head it
#     evaluated. That head is re-verified immediately before the green
#     result is published, so the published evidence can never describe a
#     commit that has already been superseded.
#   * The evaluated head is the ANNOUNCER RUN's head commit
#     (github.event.workflow_run.head_sha), never an event-carried pull
#     request number or branch name: those fields are derived by GitHub from
#     matching branch names and are not trusted here. The pull request(s)
#     are re-derived through the API from the announcing run's exact commit,
#     and each candidate's record is the authority for its base branch and
#     head.
#   * Exactly ONE verdict is published per announced head — as ONE check
#     run: the refresh OPENS the required context as an in-progress check
#     run at the announced head before any discovery or evaluation, and
#     every terminal path UPDATES that same run to its conclusion. The
#     latest run under the required name decides mergeability, so the
#     pending run immediately supersedes any earlier green verdict and
#     keeps the merge blocked for the whole refresh; a refresh that dies
#     after the pending run is opened leaves it standing (a blocked merge
#     and the failed job as the re-run signal). Recorded residual: a death
#     BEFORE the first App-authored publication — the token-mint step
#     failing, or the runner being lost before the publish step starts —
#     leaves the head's previous verdict standing, because no App-authored
#     pending run exists yet and the workflow token structurally cannot
#     open one (it holds no `checks: write`); the failed `Bot Review Gate
#     Publisher` job is the re-run signal for exactly that window.
#     Narrowing it further needs coordinator/operator architecture (the
#     same lane as the retarget-without-events decision), so it is
#     disclosed here rather than claimed away.
#     Check runs attach
#     to commits, not pull requests, so two open main pull requests sharing
#     one head commit would otherwise publish competing verdicts under the
#     one required context name — and the last-published verdict would decide
#     for both, letting a clean duplicate evaluated last make a dirty pull
#     request appear green. Every candidate evaluation therefore only RECORDS
#     its findings; one shared verdict — success only when every candidate is
#     clean, failure when any of them is not (fail-if-any-fail) — is
#     published at the end.
#   * A pending or failing result is merge-blocking only once the live `main`
#     ruleset marks "Bot Review Gate" as required. docs/dependency-updates.md
#     records the exact rollout order and the live-PR verification step.
#   * Operator rate-limit substitution: a repo-owned policy file on `main`
#     (.github/bot-review-substitution.json) may document a required bot
#     reviewer as rate-limited. For a listed reviewer ONLY, the gate then
#     waives the stale-evidence violation when — and only when — the named
#     substitute reviewer has APPROVED the exact head being evaluated,
#     every review thread is resolved, and no author has an outstanding
#     change request. A missing policy file disables the waiver entirely;
#     the waiver never touches unresolved threads or outstanding change
#     requests, and a comment-only review is never an approval. A listed
#     reviewer with no review on the pull request at all has no evidence
#     group to derive a violation from, so the gate synthesizes the
#     missing stale-evidence violation for every policy-listed reviewer
#     without reviews: the absence of a required reviewer is exactly the
#     stale evidence the substitution exists to waive, never a silent
#     pass.
#
# Refresh paths: every completion of the announcer fires this publisher —
# pull_request synchronize, review submissions/edits/dismissals, new review
# comments, cancellations included — so a cancelled announcer run
# re-evaluates the current state instead of leaving a stale verdict. Resolving
# a review thread fires no Actions event, so after resolving, re-run the
# announcer workflow or dispatch it on the pull request's head branch:
#   gh workflow run bot-review-gate.yml --ref <head branch> -f pr_number=<n>
# A dispatch on any other ref announces a run whose head is not the pull
# request head; the publisher refuses that binding exactly like a stale
# event head.
#
# Security: strictly read-only over repository content. The workflow never
# checks out any commit, holds no third-party action except the pinned
# GitHub-org app-token minter, and queries only the pull requests the API
# associates with the announcing run's commit (every page of that
# association — the endpoint pages, and dropping later pages would silently
# shrink the candidate set) — plus the repository-owned
# substitution policy file (below), read from `main`. The App private key
# that mints the publishing identity is reachable only through this job's
# protected environment (see the job block): pull-request-controlled
# workflows — which receive repository secrets on same-repository pull
# requests — can neither read environment-scoped secrets nor pass the
# environment's main-only branch policy.
#
# The required context carries an identity no pull-request-controlled job
# can produce. Every Actions workflow job — including anything a pull
# request adds, or renames this file's jobs into — publishes its check runs
# under the shared GitHub Actions integration (app 15368), and required-check
# matching is by check-run name on the head SHA. A publisher that posted its
# verdict with the workflow token would therefore be forgeable: a pull
# request could add a same-named job in any PR-controlled workflow (or
# rename this file's job) and satisfy the required context from the very
# integration the ruleset matches on, while suppressing the announcer so the
# trusted publisher never runs. The workflow token here structurally cannot
# publish at all — it holds no `checks` grant — and the required context is
# published only under a minted installation token of the dedicated
# gate-publisher GitHub App (`BOT_REVIEW_GATE_APP_ID` /
# `BOT_REVIEW_GATE_PRIVATE_KEY` repository secrets; missing credentials fail
# the job before anything can be published, leaving the required context
# unreported and the merge blocked). The live `main` ruleset entry and
# dependabot-automerge.yml require the context from that App's integration
# id (the repository variable `BOT_REVIEW_GATE_APP_ID`), which no
# pull-request job can author a check run under.
#
# A query failure, an incomplete pagination, or a head mismatch publishes a
# failing check instead of silently passing it. The same supersession rule
# covers the driver's discovery-level exits: a failed discovery query, an
# announcement with no candidate pull request, and an all-candidates-skipped
# announcement each publish the failing verdict at the announced head,
# because a refresh that publishes nothing would leave the head's previous
# verdict standing. A publication failure also leaves the previous verdict
# standing; the failed job is the operator's re-run signal.
on:
  workflow_run:
    workflows: ["Bot review gate"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  # Deliberately no `checks: write`: the workflow token must be structurally
  # unable to publish the required context. Only the minted gate-publisher
  # App token below can.

concurrency:
  group: bot-review-gate-publisher-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  publish:
    name: Bot Review Gate Publisher
    runs-on: ubuntu-latest
    # The publishing key must be reachable ONLY from trusted default-branch
    # execution. The gate-publisher App credentials are stored exclusively as
    # secrets of this GitHub environment — never also as repository-level
    # secrets, which every same-repository pull-request workflow can read —
    # and the environment itself is locked down on the repository side with
    # a protected-branch deployment policy restricted to `main` (and no
    # required reviewers, which would strand the automation). A
    # pull-request-controlled workflow that named this environment would
    # fail its branch policy and get no secrets.
    environment: bot-review-gate-publisher
    steps:
      # The single identity allowed to publish the required context. The
      # action is GitHub-org-owned, pinned to a full commit SHA, and
      # executes no repository code — it only signs a JWT and exchanges it
      # for an installation token whose check runs are authored by the
      # gate-publisher App's integration instead of the shared GitHub
      # Actions integration every pull-request job shares.
      - name: Mint the gate-publisher App token
        id: gate_publisher_token
        # v2.2.1, pinned to the full commit.
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        with:
          app-id: ${{ secrets.BOT_REVIEW_GATE_APP_ID }}
          private-key: ${{ secrets.BOT_REVIEW_GATE_PRIVATE_KEY }}
          permission-checks: write

      - name: Publish the Bot Review Gate verdict from trusted base-branch content
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_TOKEN: ${{ steps.gate_publisher_token.outputs.token }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          # The trusted expected-reviewer set, fixed by enumeration (never by
          # observation): every review-posting integration the operator has
          # authorized for this repository, listed by exact bot login and
          # matched case-insensitively with or without GitHub's "[bot]"
          # suffix. This list is default-branch content: it grows only by
          # the reviewed change that enables the bot, and it currently names
          # CodeRabbit alone — the only review integration the reviewer
          # policy authorizes (docs/refinery-config.md); operational or
          # out-of-band reviewers are not repository integrations and are
          # deliberately absent. A listed identity with no review on the
          # pull request fails the gate — an outage, a rate limit, or a
          # rename is unproven, never clean — waivable only by the
          # operator-documented substitution below. Additionally, a
          # re-review request addressed to a listed identity (the pull
          # request's API-visible requested_reviewers list) that no
          # submitted review at the evaluated head acknowledges after
          # the request event blocks independently as an
          # outstanding_bot_review_request.
          EXPECTED_BOT_REVIEWERS: "coderabbitai"
        run: |
          set -euo pipefail

          # ── One verdict per announced head ───────────────────────────────
          # Check runs attach to commits, not pull requests: two open main
          # pull requests that share one announced head would otherwise get
          # competing verdicts under the one required context name, and the
          # last-published verdict would decide for both — letting a clean
          # duplicate evaluated last make a dirty pull request appear green
          # (or causing the reverse availability failure). Every candidate
          # evaluation therefore only RECORDS its findings; exactly one
          # shared verdict is published per refresh — success only when
          # every candidate is clean, failure when any of them is not — and
          # the publication helpers below are the ONLY writers of that
          # verdict: the evaluator itself never touches the check run.

          # ── Publication bound to the evaluated head ──────────────────────
          # The verdict is published as ONE check run at the exact evaluated
          # commit, under the context name the live `main` ruleset requires,
          # authenticated as the gate-publisher App so the check run is
          # authored by that App's integration — never by the shared
          # GitHub Actions integration a pull-request job could publish
          # under. The refresh OPENS the context as an in-progress check
          # run at the announced head before any discovery or evaluation
          # (a pending required check immediately supersedes any earlier
          # green verdict and blocks the merge for the whole refresh), and
          # every terminal path UPDATES that same run to its conclusion —
          # so no evaluation window and no refresh that dies after this
          # opening can leave an old verdict standing. (A death before the
          # opening — the token-mint step or the runner — is the recorded
          # residual: the previous verdict keeps standing and the failed
          # job is the re-run signal.) The functions are called only from
          # the driver — the single in-progress start, the aggregated failure
          # branch, the aggregated success branch, and the three
          # discovery-level supersession paths (discovery failure, no
          # candidate, all candidates skipped) — so one announced head can
          # never carry competing verdicts: every refresh ends in exactly
          # one publication at the head, green only when every candidate is
          # clean.
          gate_context="Bot Review Gate"
          gate_check_run_id=""
          gate_check_run_head=""

          start_gate_check_run() {
            evaluated_head="$1"
            # Defense in depth against a future refactor dropping the mint
            # step: publishing under the shared workflow identity would
            # reopen the forged-context hole, so a missing gate token must
            # fail closed — the head's verdict keeps its previous value
            # and the failed job is the re-run signal.
            if [ -z "${GATE_TOKEN:-}" ]; then
              echo "The gate-publisher App token is missing; refusing to publish the required context under any shared identity. The head's verdict keeps its previous value and the failed job is the re-run signal." >&2
              return 1
            fi
            # gh's nested payload syntax is key[subkey]=value; a dotted
            # key would be sent as a literal top-level field and dropped
            # by the API, so the in-progress output would silently carry
            # neither title nor summary.
            if ! gate_check_run_id="$(GH_TOKEN="${GATE_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
                -F name="${gate_context}" \
                -F head_sha="${evaluated_head}" \
                -F status=in_progress \
                -F "output[title]=Bot Review Gate: evidence refresh in progress" \
                -F "output[summary]=A refresh is re-evaluating bot-review evidence at this commit. This pending check supersedes the previous verdict until the refresh finishes, so no earlier result is mergeable while evidence is being re-read." \
                --jq '.id' 2>/dev/null)" \
              || [ -z "${gate_check_run_id}" ]; then
              echo "Check-run publication failed: the in-progress refresh check could not be created; the head's verdict keeps its previous value and the failed job is the re-run signal." >&2
              return 1
            fi
            gate_check_run_head="${evaluated_head}"
          }

          finish_gate_check_run() {
            evaluated_head="$1"
            conclusion="$2"
            title="$3"
            summary="$4"
            if [ -z "${GATE_TOKEN:-}" ]; then
              echo "The gate-publisher App token is missing; refusing to publish the required context under any shared identity. The head's verdict keeps its previous value and the failed job is the re-run signal." >&2
              return 1
            fi
            if [ -z "${gate_check_run_id}" ]; then
              echo "Check-run publication failed: no in-progress check run exists to finalize; the head's verdict keeps its previous value and the failed job is the re-run signal." >&2
              return 1
            fi
            if [ "${gate_check_run_head}" != "${evaluated_head}" ]; then
              echo "Check-run publication failed: the in-progress check was opened at ${gate_check_run_head}, not ${evaluated_head}; refusing to finalize it at a different head." >&2
              return 1
            fi
            # A check run cannot move to another commit after creation, so
            # finalizing at a different head is impossible by construction —
            # the guard above refuses the impossible instead of silently
            # mis-reporting. The update carries only the terminal state, with
            # the output as genuine nested fields (key[subkey]=value — a
            # dotted key is a literal top-level field the API drops, and the
            # verdict's title and summary would never reach GitHub).
            if ! GH_TOKEN="${GATE_TOKEN}" gh api -X PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${gate_check_run_id}" \
                -F status=completed \
                -F conclusion="${conclusion}" \
                -F "output[title]=${title}" \
                -F "output[summary]=${summary}" > /dev/null; then
              echo "Check-run publication failed; the head's verdict keeps its previous value and the failed job is the re-run signal." >&2
              return 1
            fi
          }

          # Every refusal records the failing verdict for the shared
          # publication at the exact head it refused before returning, so the
          # required context carries the reason instead of dangling absent.
          # Each call site follows this with an explicit `return 1`: the
          # evaluation loop swallows set -e, so control flow must never
          # depend on it.
          record_blocked() {
            verdict_base="$1"
            report="$2"
            printf '%s\n' "${report}" > "${verdict_base}.blocked"
          }

          evaluate_pull_request() {
          PR_NUMBER="$1"
          EVENT_HEAD_SHA="$2"
          # Verdicts are recorded, never published here: check runs attach
          # to commits, not pull requests, so the one shared verdict for
          # this head is published by the driver after every candidate has
          # been evaluated (fail-if-any-fail).
          verdict_base="${VERDICTS_DIR}/pr-${PR_NUMBER}"
          pages_dir="${RUNNER_TEMP}/bot-review-gate"
          mkdir -p "${pages_dir}"
          threads_pages="${pages_dir}/threads.jsonl"
          reviews_pages="${pages_dir}/reviews.jsonl"
          decisions_jq="${pages_dir}/decisions.jq"

          repo_owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          rest_pr="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"

          # ── Pull-request record: existence, base branch, head binding ────
          # The record — not the event — is the authority for the base branch
          # and the head; the announcer head supplies the binding target.
          if ! pr_json="$(gh api "${rest_pr}")"; then
            echo "Pull request query failed; failing closed." >&2
            record_blocked "${verdict_base}" "Pull request query failed; failing closed."
            return 1
          fi
          pr_base="$(jq -r '.base.ref // ""' <<<"${pr_json}")"
          if [ "${pr_base}" != "main" ]; then
            echo "Pull request #${PR_NUMBER} targets ${pr_base:-<unknown>}, not main; failing closed." >&2
            # A non-main pull request carries no required `Bot Review Gate`
            # context at all, so it contributes neither a clean nor a blocked
            # verdict to the shared publication for this head.
            : > "${verdict_base}.skipped"
            return 1
          fi
          rest_head="$(jq -r '.head.sha // ""' <<<"${pr_json}")"
          intended_head="${EVENT_HEAD_SHA}"
          if [ -z "${intended_head}" ] || [ -z "${rest_head}" ]; then
            echo "Could not determine the pull request head; failing closed." >&2
            record_blocked "${verdict_base}" "Could not determine the pull request head; failing closed."
            return 1
          fi
          if [ "${EVENT_HEAD_SHA}" != "${rest_head}" ]; then
            echo "Announcer head ${EVENT_HEAD_SHA} no longer matches pull request head ${rest_head}; a newer event will re-evaluate; failing closed." >&2
            record_blocked "${verdict_base}" "Announcer head ${EVENT_HEAD_SHA} no longer matches pull request head ${rest_head}; failing closed."
            return 1
          fi

          # ── Paginated evidence: every review thread and every review ─────
          # Two independent connections cannot share one automatic cursor, so
          # each is paginated separately. gh's GraphQL pagination feeds the
          # $endCursor variable automatically and emits ONE JSON DOCUMENT PER
          # PAGE into the redirect target.
          thread_query='
            query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  headRefOid
                  reviewThreads(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      isResolved
                      isOutdated
                      path
                      line
                      comments(first: 1) {
                        nodes {
                          url
                          author { __typename login }
                        }
                      }
                    }
                  }
                }
              }
            }
          '
          review_query='
            query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  headRefOid
                  reviews(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      url
                      state
                      submittedAt
                      databaseId
                      commit { oid }
                      author { __typename login }
                    }
                  }
                }
              }
            }
          '
          # The ordering timeline: the review-evidence mutations that keep no
          # separate record in the submissions endpoints. Review dismissals
          # mutate the dismissed review in place (same database ID, original
          # submission time), so ordering evidence around a dismissal needs
          # the dismissal events themselves; each carries the instant of the
          # dismissal and the review it dismissed. Review requests are the
          # same class of evidence for the re-review handshake: the REST
          # requested_reviewers list is a snapshot with no timestamps, so
          # whether an at-head review acknowledges the request against it —
          # or postdates it unacknowledged — is decidable only from the
          # request events themselves, each carrying the instant and the
          # requested reviewer, plus the removal event that formally
          # withdraws a request (including GitHub's own auto-removal when
          # the reviewer submits).
          timeline_query='
            query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  headRefOid
                  timelineItems(first: 100, after: $endCursor, itemTypes: [REVIEW_DISMISSED_EVENT, REVIEW_REQUESTED_EVENT, REVIEW_REQUEST_REMOVED_EVENT]) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      __typename
                      ... on ReviewDismissedEvent {
                        createdAt
                        review { databaseId }
                      }
                      ... on ReviewRequestedEvent {
                        createdAt
                        requestedReviewer {
                          __typename
                          ... on User { login }
                          ... on Bot { login }
                        }
                      }
                      ... on ReviewRequestRemovedEvent {
                        createdAt
                        requestedReviewer {
                          __typename
                          ... on User { login }
                          ... on Bot { login }
                        }
                      }
                    }
                  }
                }
              }
            }
          '

          if ! gh api graphql --paginate -f query="${thread_query}" \
              -f owner="${repo_owner}" -f repo="${repo_name}" -F number="${PR_NUMBER}" \
              > "${threads_pages}"; then
            echo "Review-thread query failed; failing closed." >&2
            record_blocked "${verdict_base}" "Review-thread query failed; failing closed."
            return 1
          fi
          if ! gh api graphql --paginate -f query="${review_query}" \
              -f owner="${repo_owner}" -f repo="${repo_name}" -F number="${PR_NUMBER}" \
              > "${reviews_pages}"; then
            echo "Review query failed; failing closed." >&2
            record_blocked "${verdict_base}" "Review query failed; failing closed."
            return 1
          fi
          timeline_pages="${pages_dir}/timeline.jsonl"
          if ! gh api graphql --paginate -f query="${timeline_query}" \
              -f owner="${repo_owner}" -f repo="${repo_name}" -F number="${PR_NUMBER}" \
              > "${timeline_pages}"; then
            echo "Review-timeline query failed; failing closed." >&2
            record_blocked "${verdict_base}" "Review-timeline query failed; failing closed."
            return 1
          fi

          # A response without the pull request did not answer the question
          # and must never read as "no findings". `gh api graphql --paginate`
          # emits one JSON document per page and a plain `jq -e` derives its
          # exit status from the LAST value only — so each guard slurps every
          # page and verifies each one reported the pull request.
          completeness_guard='all(.[]; .data.repository.pullRequest != null)'
          if ! jq -s -e "${completeness_guard}" "${threads_pages}" > /dev/null; then
            echo "Review-thread response omitted the pull request; failing closed." >&2
            record_blocked "${verdict_base}" "Review-thread response omitted the pull request; failing closed."
            return 1
          fi
          if ! jq -s -e "${completeness_guard}" "${reviews_pages}" > /dev/null; then
            echo "Review response omitted the pull request; failing closed." >&2
            record_blocked "${verdict_base}" "Review response omitted the pull request; failing closed."
            return 1
          fi
          if ! jq -s -e "${completeness_guard}" "${timeline_pages}" > /dev/null; then
            echo "Review-timeline response omitted the pull request; failing closed." >&2
            record_blocked "${verdict_base}" "Review-timeline response omitted the pull request; failing closed."
            return 1
          fi

          # A partial body is equally unproven: a GraphQL error entry can sit
          # beside a valid head on an HTTP 200, and a null connection under an
          # otherwise complete pull request silently iterates as empty — both
          # would read as "no findings" downstream. Each guard therefore also
          # demands a complete body: no `errors` key on any page, and the
          # queried connection present on every page.
          if ! jq -s -e 'all(.[]; (has("errors") | not) and .data.repository.pullRequest.reviewThreads != null)' \
              "${threads_pages}" > /dev/null; then
            echo "Review-thread response was partial (GraphQL errors or a missing reviewThreads connection); failing closed." >&2
            record_blocked "${verdict_base}" "Review-thread response was partial (GraphQL errors or a missing reviewThreads connection); failing closed."
            return 1
          fi
          if ! jq -s -e 'all(.[]; (has("errors") | not) and .data.repository.pullRequest.reviews != null)' \
              "${reviews_pages}" > /dev/null; then
            echo "Review response was partial (GraphQL errors or a missing reviews connection); failing closed." >&2
            record_blocked "${verdict_base}" "Review response was partial (GraphQL errors or a missing reviews connection); failing closed."
            return 1
          fi
          if ! jq -s -e 'all(.[]; (has("errors") | not) and .data.repository.pullRequest.timelineItems != null)' \
              "${timeline_pages}" > /dev/null; then
            echo "Review-timeline response was partial (GraphQL errors or a missing timelineItems connection); failing closed." >&2
            record_blocked "${verdict_base}" "Review-timeline response was partial (GraphQL errors or a missing timelineItems connection); failing closed."
            return 1
          fi

          # Bind pagination to the intended head: a push during pagination
          # changes headRefOid in later pages and must fail the check instead
          # of mixing evidence from two commits.
          head_binding_guard='all(.[]; .data.repository.pullRequest.headRefOid == $head)'
          if ! jq -s -e --arg head "${intended_head}" "${head_binding_guard}" "${threads_pages}" > /dev/null \
            || ! jq -s -e --arg head "${intended_head}" "${head_binding_guard}" "${reviews_pages}" > /dev/null \
            || ! jq -s -e --arg head "${intended_head}" "${head_binding_guard}" "${timeline_pages}" > /dev/null; then
            echo "Paginated evidence spans a head other than ${intended_head}; a push landed mid-query; failing closed." >&2
            record_blocked "${verdict_base}" "Paginated evidence spans a head other than ${intended_head}; a push landed mid-query; failing closed."
            return 1
          fi

          # ── Requested re-reviews: the API-visible handshake half ─────────
          # docs/refinery-config.md: whether a re-review is in flight is
          # knowable through a gate-visible, trusted handshake, and an
          # outstanding handshake at the evaluated head invalidates that
          # reviewer's earlier clean result there. The API-visible half is
          # the pull request's requested_reviewers list — GitHub's own
          # record, not a bot-asserted signal. The endpoint returns one
          # document (it does not paginate), and a query failure fails
          # closed like every other evidence read.
          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
              > "${pages_dir}/requested-reviewers.json"; then
            echo "Requested-reviewers query failed; failing closed." >&2
            record_blocked "${verdict_base}" "Requested-reviewers query failed; failing closed."
            return 1
          fi

          # ── Substitution policy: documented reviewer rate limits ────────
          # The operator may document a rate-limited required reviewer in a
          # repo-owned file on `main`. The file is read from `main` so a
          # pull request can never edit its own waiver. Any fetch problem
          # other than a clean 404, and any malformed document, disables
          # the waiver (and warns) instead of enabling it: the substitution
          # is an opt-in relaxation, so its failure mode is "no waiver",
          # never "gate passes".
          substitution_path=".github/bot-review-substitution.json"
          policy_json=""
          if policy_response="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${substitution_path}?ref=main" 2>"${RUNNER_TEMP}/policy-fetch.err")"; then
            policy_b64="$(jq -r '.content // ""' <<<"${policy_response}" | tr -d '\n')"
            if policy_json="$(printf '%s' "${policy_b64}" | base64 -d 2>/dev/null)" \
              && [ -n "${policy_json}" ] \
              && jq -e 'type == "object"
                        and (.substitute_reviewer | type == "string" and length > 0)
                        and (.rate_limited_reviewers | type == "array")
                        and all(.rate_limited_reviewers[];
                                type == "object"
                                and (.login | type == "string" and length > 0)
                                and (.evidence | type == "string" and length > 0))' \
                <<<"${policy_json}" > /dev/null; then
              :
            else
              policy_json=""
              echo "WARNING: ${substitution_path} on main is present but malformed; the rate-limit substitution stays disabled." >&2
            fi
          else
            fetch_err="$(cat "${RUNNER_TEMP}/policy-fetch.err" 2>/dev/null || true)"
            case "${fetch_err}" in
              *"(HTTP 404)"*|*"Not Found"*) : ;; # no policy on file: the waiver is simply unavailable
              *)
                if [ -n "${fetch_err}" ]; then
                  echo "WARNING: could not read ${substitution_path} from main; the rate-limit substitution stays disabled." >&2
                fi
                ;;
            esac
          fi
          policy_file="${RUNNER_TEMP}/substitution-policy.json"
          if [ -n "${policy_json}" ]; then
            printf '%s' "${policy_json}" > "${policy_file}"
          else
            printf 'null' > "${policy_file}"
          fi

          # ── Decisions: the complete rule set, in one reviewed filter ─────
          cat > "${decisions_jq}" <<'DECISIONS'
            # A bot author is a GitHub App account or a "[bot]"-suffixed login.
            def is_bot:
              .author != null
              and (.author.__typename == "Bot" or ((.author.login // "") | endswith("[bot]")));

            # Every review thread a bot started that is NOT explicitly
            # resolved. GitHub's "outdated" flag never substitutes for
            # resolution: code movement is not evidence that a finding was
            # addressed, so outdated-unresolved threads stay in the report.
            def unresolved_bot_threads:
              [ .[]
                | .data.repository.pullRequest.reviewThreads.nodes[]
                | select(.isResolved == false)
                | select(.comments.nodes[0] | is_bot)
                | {
                    reason: "unresolved_bot_review_thread",
                    author: (.comments.nodes[0].author.login // ""),
                    path: .path,
                    line: .line,
                    outdated: .isOutdated,
                    url: .comments.nodes[0].url
                  } ];

            # Per-bot-author conclusion from the complete paginated review
            # list. Only a DECISIVE review carries a conclusion
            # (databaseId grows monotonically within one pull request);
            # the author's latest decisive review decides:
            #   CHANGES_REQUESTED — an outstanding change request, wherever
            #                       it was made;
            #   DISMISSED         — formally withdrawn, no outstanding
            #                       conclusion left, and no freshness debt
            #                       of its own (the dismissal is an
            #                       administrator action on the old review,
            #                       not new evidence about the head);
            #   anything else     — the review must be bound to the evaluated
            #                       head, or the evidence is stale.
            # A comment-only review is never decisive: GitHub clears
            # Request-changes only on a later approval or a formal dismissal,
            # so ranking every state together would let a comment silently
            # lift an outstanding change request. A dismissal clears the
            # dismissed conclusion but exempts only itself from the head
            # binding: any review submitted AFTER the dismissal is ordinary
            # evidence again and must sit at the evaluated head — and "after"
            # is decided against the recorded dismissal time ($dismissals,
            # from the review timeline), because a dismissal keeps the
            # dismissed review's database ID and submission timestamp, so
            # review IDs alone misorder evidence around a dismissal and
            # would hold pre-dismissal comments against the head forever.
            # Reviews submitted before the dismissal are cleared with it.
            # If the timeline records no dismissal event for a DISMISSED
            # decisive review, the around-dismissal ordering cannot be
            # verified and the branch fails closed into the ordinary
            # stale-evidence check below.
            def bot_review_violations($head; $dismissals):
              [ .[]
                | .data.repository.pullRequest.reviews.nodes[]
                | select(.state == "CHANGES_REQUESTED" or .state == "APPROVED" or .state == "COMMENTED" or .state == "DISMISSED" or .state == "PENDING")
                | select(is_bot)
                | {
                    author: (.author.login // ""),
                    state: .state,
                    review_head: (.commit.oid // ""),
                    submitted_at: (.submittedAt // ""),
                    database_id: .databaseId,
                    url: .url
                  } ]
              | group_by(.author)[]
              # A PENDING review is an attempt in flight: while one exists
              # (at most one per author per pull request), none of the
              # author's earlier conclusions count at this head — the
              # pending attempt may overturn them — so the terminal-state
              # analysis below runs on the author's submitted reviews only
              # and the pending attempt itself is reported as its own
              # blocking violation, bound to the attempt's commit and
              # database ID. A pending attempt at any commit — the
              # evaluated head included — blocks: only a submitted or
              # discarded attempt lets the author's evidence count again.
              | (map(select(.state == "PENDING")) | sort_by(.database_id) | last) as $pending
              | (map(select(.state != "PENDING"))) as $terminal
              | ($terminal | sort_by(.database_id) | last) as $latest
              | ($terminal
                 | map(select(.state == "CHANGES_REQUESTED"
                        or .state == "APPROVED"
                        or .state == "DISMISSED"))
                 | sort_by(.database_id)
                 | last) as $decisive
              | ($decisive.database_id as $dismissed_id
                 | [ $dismissals[]
                     | select(.review_id == $dismissed_id)
                     | .dismissed_at ]
                   | max // "") as $dismissed_at
              | (map(select((.database_id > ($decisive.database_id // 0))
                            and (($decisive.state != "DISMISSED")
                                 or ($dismissed_at != ""
                                     and (.submitted_at > $dismissed_at)))))
                 | sort_by(.submitted_at, .database_id)
                 | last) as $after_decisive
              | ( if $latest == null then
                    # The author has no submitted review at all (their only
                    # review, if any, is the pending attempt above): the
                    # terminal-state rules have nothing to decide, and the
                    # absence itself is reported by the expected-reviewer
                    # check below. A comment-only author has a latest review
                    # and falls through to the ordinary rules below: the
                    # decisive chain finds no conclusion to act on, and the
                    # head-binding branch reports the comment as stale
                    # evidence when it predates the evaluated head — a bot's
                    # latest review is bound to the exact commit regardless
                    # of whether it carried a conclusion.
                    []
                  elif $decisive.state == "CHANGES_REQUESTED" then
                    [ { reason: "outstanding_bot_change_request",
                        author: $decisive.author,
                        review_head: $decisive.review_head,
                        url: $decisive.url } ]
                  elif $decisive.state == "DISMISSED"
                    and $dismissed_at != ""
                    and (($after_decisive.review_head // $head) == $head)
                  then []
                  elif $latest.review_head != $head then
                    [ { reason: "stale_bot_review_evidence",
                        author: $latest.author,
                        state: $latest.state,
                        review_head: $latest.review_head,
                        expected_head: $head,
                        url: $latest.url } ]
                  else []
                  end )
                + ( if $pending == null then []
                    else [ { reason: "pending_bot_review",
                             author: $pending.author,
                             review_head: ($pending.review_head // "none"),
                             database_id: $pending.database_id,
                             url: $pending.url } ]
                    end );

            # Logins are matched case-insensitively, with GitHub's "[bot]"
            # suffix stripped from both sides: the expected list carries the
            # plain integration login, while the API may surface it with or
            # without the suffix.
            def normalize_login:
              ascii_downcase | sub("\\[bot\\]$"; "");

            # The trusted expected-reviewer set from the publisher's
            # EXPECTED_BOT_REVIEWERS: split on commas, trimmed, suffix- and
            # case-normalized, empties dropped. An EMPTY configured set is a
            # configuration failure, never a vacuous pass — with nobody
            # expected the all-green policy would be unenforceable — so it
            # emits its own non-waivable blocking violation.
            def expected_reviewers:
              [ ($expected | split(","))
                | .[]
                | gsub("^\\s+|\\s+$"; "")
                | select(length > 0)
                | normalize_login ];

            # Every expected reviewer with NO review on the pull request —
            # any state, pending included, counts as present for this check;
            # a pending-only reviewer is reported by the pending rule above,
            # and a submitted-reviewer staleness by the decisive rules —
            # yields the same waivable stale-evidence violation the
            # substitution contract knows how to waive. Absence of a
            # required reviewer is unproven, never clean: an outage, a rate
            # limit, or a rename fails closed exactly like a rejected
            # review, threads or no threads.
            def expected_reviewer_violations($head):
              expected_reviewers as $expected_set
              | [ $reviews[].data.repository.pullRequest.reviews.nodes[]
                  | ((.author.login // "") | normalize_login) ] as $reviewed
              | if ($expected_set | length) == 0 then
                  [ { reason: "trusted_reviewer_set_empty",
                      author: "(configuration)",
                      state: "no trusted reviewers configured",
                      review_head: "none",
                      expected_head: $head,
                      url: "EXPECTED_BOT_REVIEWERS in bot-review-gate-publisher.yml" } ]
                else
                  # The element must be bound with `as` before the select:
                  # inside `select($reviewed | index($login) | not)` the
                  # argument's `.` would otherwise be rebound by the pipe to
                  # $reviewed itself, so `index` would search the review list
                  # for the whole list and filter out every absence — the
                  # check would silently pass whenever any review exists.
                  [ $expected_set[]
                    | . as $login
                    | select($reviewed | index($login) | not)
                    | { reason: "stale_bot_review_evidence",
                        author: $login,
                        state: "no review submitted",
                        review_head: "none",
                        expected_head: $head,
                        url: "trusted reviewer set in bot-review-gate-publisher.yml (EXPECTED_BOT_REVIEWERS)" } ]
                end;


            # reviewer's missing evidence manifests as a waivable
            # stale-evidence violation. bot_review_violations can only
            # derive violations from reviews that exist, so a listed
            # reviewer with NO review on the pull request — the reviewer
            # being unavailable before ever reviewing — would otherwise
            # leave the gate green with no substitute approval at all.
            # Synthesize the missing stale-evidence violation for every
            # listed login absent from the review list; it is waivable
            # exactly like derived stale evidence, only under an eligible
            # substitution.
            def missing_evidence_violations($head; $policy):
              [ $reviews[].data.repository.pullRequest.reviews.nodes[]
                | (.author.login // "") ] as $reviewed
              | [ $policy.rate_limited_reviewers[]?
                  | . as $entry
                  | select($reviewed | index($entry.login) | not)
                  | { reason: "stale_bot_review_evidence",
                      author: $entry.login,
                      state: "no review submitted",
                      review_head: "none",
                      expected_head: $head,
                      url: $entry.evidence } ]
              | unique_by(.author);

            # The fail-closed half of the documented re-review handshake: a
            # re-review request addressed to a trusted expected reviewer is
            # an attempt in flight. Until a submitted review at the
            # evaluated head acknowledges THAT attempt, the request
            # invalidates that reviewer's earlier clean result at this head
            # — the prior approval stops counting. The acknowledgment is
            # attempt-bound through the review-request timeline events
            # ($review_requests, fetched like the dismissals): the REST
            # requested_reviewers list is a timestampless snapshot, so a
            # listed request is only provably answered when the reviewer's
            # at-head review was submitted AFTER the latest request event
            # for that reviewer — the bounded API-lag race (request first,
            # at-head review just after) passes, while a request that
            # postdates every at-head review keeps the gate red, because
            # the older review cannot acknowledge a request it predates. A
            # removal event after the latest request formally withdraws
            # that attempt (GitHub also auto-removes a request when the
            # reviewer submits), so the request no longer stands even while
            # the snapshot list still carries the reviewer. A listed
            # reviewer with no request event in the timeline has no
            # ordering evidence at all and fails closed as outstanding,
            # exactly like unproven evidence elsewhere in this gate.
            # Requests to any other login are out of scope: only the
            # enumerated trusted set is bound by the handshake. The
            # violation is NOT waivable by the rate-limit substitution —
            # that waiver covers a listed reviewer's missing or stale
            # evidence, never an outstanding re-review request.
            def outstanding_request_violations($head; $review_requests):
              expected_reviewers as $expected_set
              | [ $requested[0].users[]?
                  | ((.login // "") | normalize_login) ] as $requested_set
              | [ $reviews[].data.repository.pullRequest.reviews.nodes[]
                  | select(.state != "PENDING")
                  | select((.commit.oid // "") == $head)
                  | { author: ((.author.login // "") | normalize_login),
                      submitted_at: (.submittedAt // "") } ] as $head_reviews
              | [ $expected_set[]
                  | . as $login
                  | select($requested_set | index($login))
                  | (($review_requests
                      | map(select(.reviewer == $login and .event == "requested"))
                      | map(.created_at) | max) // "") as $latest_request_at
                  | (($review_requests
                      | map(select(.reviewer == $login and .event == "removed"))
                      | map(.created_at) | max) // "") as $latest_removal_at
                  | ( if $latest_request_at == "" then
                        # Listed but unordered: no timeline event proves when
                        # the request was made, so no at-head review can be
                        # proven to acknowledge it.
                        "outstanding (no review-request event to order against)"
                      elif $latest_removal_at != ""
                        and $latest_removal_at > $latest_request_at then
                        # The latest attempt was formally withdrawn after it
                        # was made: nothing is in flight.
                        ""
                      elif [ $head_reviews[]
                             | select(.author == $login)
                             | select(.submitted_at > $latest_request_at) ]
                            | length > 0 then
                        # An at-head review submitted after the request
                        # acknowledges this specific attempt.
                        ""
                      elif [ $head_reviews[] | select(.author == $login) ]
                            | length > 0 then
                        "re-review requested after the reviewer's review at this head"
                      else
                        "re-review requested, none submitted at this head"
                      end )
                  | select(. != "")
                  | { reason: "outstanding_bot_review_request",
                      author: $login,
                      state: .,
                      review_head: "none",
                      expected_head: $head,
                      url: "requested_reviewers of this pull request" } ];

            # Operator rate-limit substitution: for a reviewer documented in
            # the repo-owned policy file, the stale-evidence violation may
            # be waived only when ALL of the following hold at the exact
            # evaluated head:
            #   * the policy is present and well-formed (checked before this
            #     filter; a malformed or missing file passes null here);
            #   * the policy's substitute reviewer has an APPROVED review —
            #     a comment-only review is never an approval — bound to the
            #     exact head being evaluated;
            #   * every review thread is resolved (bot or human);
            #   * no author has an outstanding change request (bot or
            #     human; latest decisive review per author decides).
            # The waiver removes ONLY the stale_bot_review_evidence
            # violations of the listed reviewers: unresolved threads and
            # outstanding change requests always block.
            def substitution_eligible($head; $policy):
              ($policy != null)
              and ([ $threads[].data.repository.pullRequest.reviewThreads.nodes[]
                     | select(.isResolved == false) ] | length == 0)
              and ([ $reviews[].data.repository.pullRequest.reviews.nodes[]
                     | select(.state == "CHANGES_REQUESTED"
                            or .state == "APPROVED"
                            or .state == "DISMISSED")
                     | { author: (.author.login // ""), database_id: .databaseId, state: .state } ]
                   | group_by(.author)
                   | all(.[]; ((sort_by(.database_id) | last).state != "CHANGES_REQUESTED")))
              and ([ $reviews[].data.repository.pullRequest.reviews.nodes[]
                     | select(.author.login == $policy.substitute_reviewer)
                     | select(.state == "APPROVED" and .commit.oid == $head) ] | length > 0);

            $policy[0] as $policy
            | ([ $timeline[].data.repository.pullRequest.timelineItems.nodes[]
                 | select(.review != null)
                 | { review_id: .review.databaseId,
                     dismissed_at: .createdAt } ]) as $dismissals
            | ([ $timeline[].data.repository.pullRequest.timelineItems.nodes[]
                 | select(.__typename == "ReviewRequestedEvent"
                          or .__typename == "ReviewRequestRemovedEvent")
                 | { event: (if .__typename == "ReviewRequestedEvent"
                             then "requested" else "removed" end),
                     reviewer: ((.requestedReviewer.login // "") | normalize_login),
                     created_at: .createdAt }
                 | select(.reviewer != "") ]) as $review_requests
            | ( ($threads | unresolved_bot_threads)
              + [ $reviews | bot_review_violations($head; $dismissals)[] ]
              + expected_reviewer_violations($head)
              + missing_evidence_violations($head; $policy)
              + outstanding_request_violations($head; $review_requests) ) as $all_violations
            | substitution_eligible($head; $policy) as $eligible
            # Waiver matching is login-normalized on BOTH sides: the
            # expected-reviewer check emits the normalized login (the
            # enumeration is matched "[bot]"-suffix-insensitively) while the
            # policy file records the raw operator-spelled login, and the
            # same absent reviewer's two synthesized violations must agree —
            # waivable through one path and blocking through the other would
            # make the waiver unreachable or over-broad depending on which
            # check happened to synthesize the finding.
            | (($policy.rate_limited_reviewers // [])
               | map(.login | normalize_login)) as $waivable_logins
            | {
                evaluated_head: $head,
                evaluated_threads: ([ $threads[].data.repository.pullRequest.reviewThreads.nodes[] ] | length),
                evaluated_reviews: ([ $reviews[].data.repository.pullRequest.reviews.nodes[] ] | length),
                violations: (
                  if $eligible then
                    [ $all_violations[]
                      | . as $v
                      | select(.reason != "stale_bot_review_evidence"
                               or ($waivable_logins
                                   | index($v.author | normalize_login) | not)) ]
                  else $all_violations
                  end
                ),
                waived: (
                  if $eligible then
                    [ $all_violations[]
                      | select(.reason == "stale_bot_review_evidence")
                      | . as $v
                      | select($waivable_logins
                               | index($v.author | normalize_login))
                      | { author: $v.author,
                          url: $v.url,
                          substitute: $policy.substitute_reviewer,
                          # The evidence is looked up with the same
                          # login-normalized matching as the waiver decision
                          # above, so the report cites the policy entry for
                          # the violation it actually waived regardless of
                          # the two spellings.
                          evidence: ([ $policy.rate_limited_reviewers[]
                                       | select((.login | normalize_login)
                                                == ($v.author | normalize_login)) ]
                                      | map(.evidence) | join(", ")) } ]
                  else []
                  end
                )
              }
          DECISIONS

          # The decision filter is the gate's whole arithmetic, and the
          # candidate loop below swallows errexit (`|| true`) on purpose —
          # so this status must be checked EXPLICITLY: a jq failure over a
          # partial-200 evidence shape, or any defect in the filter itself,
          # must block, never fall through as an empty `evaluated` whose
          # empty violation report reads as clean. The verdict shape is
          # validated for the same reason: an output that is empty, a
          # non-object, or bound to another head is a failed evaluation,
          # and only a validated verdict can ever reach `.clean`.
          if ! evaluated="$(jq -n \
            --slurpfile threads "${threads_pages}" \
            --slurpfile reviews "${reviews_pages}" \
            --slurpfile timeline "${timeline_pages}" \
            --slurpfile requested "${pages_dir}/requested-reviewers.json" \
            --slurpfile policy "${policy_file}" \
            --arg head "${intended_head}" \
            --arg expected "${EXPECTED_BOT_REVIEWERS:-}" \
            -f "${decisions_jq}")" \
            || [ -z "${evaluated}" ] \
            || ! jq -e '
                (type == "object")
                and (.evaluated_head == $head)
                and (.evaluated_threads | type == "number")
                and (.evaluated_reviews | type == "number")
                and (.violations | type == "array")
                and (.waived | type == "array")' \
                --arg head "${intended_head}" \
                >/dev/null <<<"${evaluated}"; then
            echo >&2 "Decision evaluation failed or returned a malformed verdict; failing closed."
            record_blocked "${verdict_base}" "Decision evaluation failed or returned a malformed verdict; failing closed."
            return 1
          fi

          jq -r '.waived[] |
                 "RATE-LIMIT SUBSTITUTION: stale evidence by \(.author) waived under the documented rate limit"
                 + " (\(.evidence)) — substitute approval by \(.substitute) at the evaluated head: \(.url)"' \
            <<<"${evaluated}"
          violation_count="$(jq '.violations | length' <<<"${evaluated}")"
          if [ "${violation_count}" -gt 0 ]; then
            violation_report="$(jq -r '.violations[] |
              if .reason == "unresolved_bot_review_thread" then
                "UNRESOLVED BOT REVIEW THREAD"
                + (if .outdated then " (outdated — movement is not resolution)" else "" end)
                + ": " + .url + " — " + .path + ":" + ((.line // 0) | tostring) + " by " + .author
              elif .reason == "outstanding_bot_change_request" then
                "OUTSTANDING BOT CHANGE REQUEST by " + .author + ": " + .url
              elif .reason == "pending_bot_review" then
                "PENDING BOT REVIEW ATTEMPT by " + .author
                + " (database id " + (.database_id | tostring)
                + " at " + .review_head + "): " + .url
              elif .reason == "outstanding_bot_review_request" then
                "OUTSTANDING BOT REVIEW REQUEST by " + .author
                + " (" + .state + " at head " + .expected_head + "): " + .url
              elif .reason == "trusted_reviewer_set_empty" then
                "TRUSTED REVIEWER SET EMPTY — no trusted reviewers are configured: " + .url
              else
                "STALE BOT REVIEW EVIDENCE by " + .author + " (" + .state + " at " + .review_head
                + ", pull request head is " + .expected_head + "): " + .url
              end' <<<"${evaluated}")"
            printf '%s\n' "${violation_report}"
            echo >&2 "Bot review evidence is not clean at ${intended_head}; address the findings above, explicitly resolve their threads, and dismiss or supersede outstanding change requests."
            echo >&2 "Thread resolution fires no Actions event: after resolving, re-run this check, or run:"
            echo >&2 "  gh workflow run bot-review-gate.yml --ref <head branch> -f pr_number=${PR_NUMBER}"
            record_blocked "${verdict_base}" "${violation_report}"
            return 1
          fi

          # ── Publication bound to the intended head ───────────────────────
          # The green result must never describe a commit that was already
          # superseded while it was being computed.
          final_head="$(gh api "${rest_pr}" --jq '.head.sha')"
          if [ "${final_head}" != "${intended_head}" ]; then
            echo "Pull request head moved to ${final_head} while evaluating ${intended_head}; failing closed." >&2
            record_blocked "${verdict_base}" "Pull request head moved to ${final_head} while evaluating ${intended_head}; failing closed."
            return 1
          fi
          summary="$(jq -r '"Bot Review Gate: clean at \(.evaluated_head) (review threads evaluated: \(.evaluated_threads), reviews evaluated: \(.evaluated_reviews))"' \
            <<<"${evaluated}")"
          # The clean verdict is recorded for the shared publication below,
          # never published here: a sibling pull request sharing this head
          # can still turn the commit's one required context red.
          printf '%s\n' "${summary}"
          printf '%s\n' "${summary}" > "${verdict_base}.clean"
          return 0
          }

          # ── Aggregate the recorded candidate verdicts ────────────────────
          # The evaluations above only recorded their findings; the driver
          # below turns the recordings into the one shared verdict.
          VERDICTS_DIR="${RUNNER_TEMP}/bot-review-gate-verdicts"
          rm -rf "${VERDICTS_DIR}"
          mkdir -p "${VERDICTS_DIR}"

          # ── The evaluated head is the announcer run's head commit ────────
          # Never an event-carried pull request number or branch name: those
          # are derived from matching branch names and are not trusted. The
          # pull requests are re-derived from this exact commit via the API.
          announcer_head="${EVENT_HEAD_SHA:-}"
          if [ -z "${announcer_head}" ] && [ -n "${EVENT_RUN_ID:-}" ]; then
            # The completion event carried no head commit. The Actions run
            # record is the same authority GitHub derived the event field
            # from, so recover the head from it before giving up — exiting
            # here would skip the supersession duty every refresh owes the
            # announced head.
            recovered_head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVENT_RUN_ID}" --jq '.head_sha // empty' 2>/dev/null || true)"
            if [ -n "${recovered_head}" ]; then
              echo "The completion event carried no head commit; using the announcing run's head ${recovered_head} from the Actions run record." >&2
              announcer_head="${recovered_head}"
            fi
          fi
          if [ -z "${announcer_head}" ]; then
            # No head is known, so no check-run can be honestly bound —
            # and none superseded. This is the only publication-less exit:
            # the context keeps its previous verdict and the failed job is
            # the re-run signal.
            echo "The publisher requires the announcing run's head commit; failing closed." >&2
            exit 1
          fi

          # ── The refresh opens the required context before evaluating ─────
          # The latest completed run under the required name decides
          # mergeability, so an old green verdict stays mergeable for as
          # long as the refresh runs. Opening the context as an in-progress
          # App-authored check run at the announced head BEFORE any
          # discovery or evaluation immediately supersedes that old verdict
          # — the pending run blocks the merge for the whole refresh — and
          # every terminal path below UPDATES this same run to its
          # conclusion. A refresh that dies after this opening leaves the
          # pending run standing (a blocked merge, and the failed job as
          # the re-run signal) instead of resurrecting a stale green. A
          # death BEFORE the opening — the mint step or the runner — is the
          # recorded residual: the previous verdict keeps standing and the
          # failed job is the re-run signal. If the start call itself
          # fails, nothing was superseded and nothing is finalized: the
          # previous verdict keeps standing and the failed job is the
          # re-run signal.
          if ! start_gate_check_run "${announcer_head}"; then
            exit 1
          fi

          # ── Pull-request discovery, bound to the announcer's commit ──────
          # `commits/<sha>/pulls` lists the pull requests *associated with*
          # the announcing run's commit — which includes stacked descendants
          # that merely CONTAIN it. Only a record whose own head is the
          # announced commit is a pull request this run may evaluate: a
          # descendant would hit the head-mismatch refusal and publish a
          # failing verdict at the announced commit, blocking the genuine
          # pull request headed there on every refresh. Selection therefore
          # compares each record's head SHA to the announced SHA before any
          # evaluation.
          # The association endpoint PAGINATES: pulling only the first page
          # would silently shrink the candidate set for a commit shared by
          # more pull requests than one page holds, and a dropped candidate's
          # refusal would never reach the shared verdict. Walk every page and
          # aggregate the records into one array before selection. The script
          # must stay free of bash-4-only builtins (see below), so the pages
          # are collected as JSON Lines and slurped into one array.
          associated_dir="${RUNNER_TEMP}/bot-review-gate-associated"
          rm -rf "${associated_dir}"
          mkdir -p "${associated_dir}"
          associated_jsonl="${associated_dir}/associated.jsonl"
          : > "${associated_jsonl}"
          page=1
          while :; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${announcer_head}/pulls?per_page=100&page=${page}" \
                > "${associated_dir}/page-${page}.json"; then
              echo "Associated-pull-request query failed; failing closed." >&2
              # A refresh that exits here would leave the head's previous
              # verdict standing — including a green one that predates a bot
              # change request submitted at this same head, or one kept alive
              # by a transient discovery failure. The in-progress run opened
              # above is finalized to the superseding failure before exiting.
              if ! finish_gate_check_run "${announcer_head}" "failure" \
                  "Bot Review Gate: refresh failed before evaluation" \
                  "The associated-pull-request discovery query failed, so bot-review evidence at this commit could not be re-evaluated. This failing result supersedes any earlier verdict published at this commit; a later announcer completion publishes the current verdict."; then
                exit 1
              fi
              exit 1
            fi
            page_count="$(jq 'length' "${associated_dir}/page-${page}.json")"
            if [ "${page_count}" -gt 0 ]; then
              jq -c '.[]' "${associated_dir}/page-${page}.json" >> "${associated_jsonl}"
            fi
            if [ "${page_count}" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          associated="$(jq -s '.' "${associated_jsonl}")"
          # The publisher script is also materialized and executed by
          # tests/bot_review_gate/harness.rs on the test host, whose /bin/bash
          # can be the macOS bash 3.2 — so this script must stay free of
          # bash-4-only builtins (mapfile/readarray). A while-read loop
          # fills the same array portably.
          candidate_prs=()
          while IFS= read -r candidate_pr; do
            if [ -n "${candidate_pr}" ]; then
              candidate_prs+=("${candidate_pr}")
            fi
          done < <(jq -r --arg announcer_head "${announcer_head}" '.[]
            | select(.state == "open"
                     and .base.ref == "main"
                     and ((.head.sha // "") | ascii_downcase) == ($announcer_head | ascii_downcase))
            | .number' <<<"${associated}")
          if [ "${#candidate_prs[@]}" -eq 0 ]; then
            echo "No open pull request against main is headed by the announced commit ${announcer_head}; publishing the not-evaluated verdict."
            # An empty candidate list is not evidence of cleanliness: a
            # read-after-write lag on commits/<sha>/pulls, a just-closed
            # pull request, a dispatch on a branch without a pull request,
            # or an announced commit that only a stacked descendant
            # contains all land here. A refresh that published nothing
            # would leave an earlier verdict at this commit standing, so
            # publish the superseding failure. The red is inert where no
            # open main pull request is headed — that commit merges
            # nowhere — and opening or retargeting a pull request onto this
            # commit fires its own announcement, which publishes the fresh
            # verdict.
            if ! finish_gate_check_run "${announcer_head}" "failure" \
                "Bot Review Gate: no open main pull request at this commit" \
                "No open pull request against main is headed by this commit, so no bot-review evidence was evaluated here. This failing result supersedes any earlier verdict published at this commit; opening or retargeting a pull request headed here re-announces the gate."; then
              exit 1
            fi
            exit 0
          fi

          for pr_number in "${candidate_prs[@]}"; do
            # The loop swallows set -e by design: a refusal records its
            # verdict and evaluation continues, because the shared verdict
            # needs every candidate's outcome.
            evaluate_pull_request "${pr_number}" "${announcer_head}" || true
          done

          blocked_reports=()
          clean_summaries=()
          shopt -s nullglob
          for verdict_file in "${VERDICTS_DIR}"/*; do
            case "${verdict_file}" in
              *.blocked) blocked_reports+=("$(cat "${verdict_file}")") ;;
              *.clean) clean_summaries+=("$(cat "${verdict_file}")") ;;
            esac
          done
          shopt -u nullglob

          if [ "${#blocked_reports[@]}" -gt 0 ]; then
            echo >&2 "Bot review evidence is not clean at ${announcer_head}: ${#blocked_reports[@]} of ${#candidate_prs[@]} associated pull request(s) are blocked; publishing the shared failing verdict (fail-if-any-fail)."
            if ! finish_gate_check_run "${announcer_head}" "failure" \
                "Bot Review Gate: unresolved or stale bot-review evidence" \
                "$(printf '%s\n' "${blocked_reports[@]}")"; then
              exit 1
            fi
            exit 1
          fi

          if [ "${#clean_summaries[@]}" -gt 0 ]; then
            if [ "${#clean_summaries[@]}" -gt 1 ]; then
              echo "Publishing one shared green verdict for ${#clean_summaries[@]} associated pull requests at ${announcer_head}."
            fi
            if ! finish_gate_check_run "${announcer_head}" "success" \
                "${clean_summaries[0]}" \
                "$(printf '%s\n' "${clean_summaries[@]}")"; then
              exit 1
            fi
            exit 0
          fi

          echo >&2 "Every selected pull request skipped evaluation (its base is no longer main); publishing the superseding failure at the announced head."
          # Retargeting away from main fires no Actions event, so this path
          # can be the ONLY refresh a retargeted pull request's head ever
          # sees: publishing nothing would leave its previous verdict —
          # possibly green — standing at the commit, ready to apply again
          # after a retarget back to main, which fires no refresh either.
          if ! finish_gate_check_run "${announcer_head}" "failure" \
              "Bot Review Gate: every associated pull request skipped evaluation" \
              "Every open pull request headed by this commit now targets a branch other than main, so none was evaluated. This failing result supersedes any earlier verdict published at this commit; retargeting a pull request back to main fires its own announcement, which publishes the fresh verdict."; then
            exit 1
          fi
          exit 1
