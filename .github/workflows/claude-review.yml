name: Claude PR Review

# Automatic review on every pull request — no @claude mention required.
# Based on the official automatic-review example from anthropics/claude-code-action (v1):
# https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Creates a tracking comment with progress checkboxes and updates it
          # as the review proceeds.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review with the following focus areas:

            1. **Correctness**
               - Logic errors, off-by-one errors, and unhandled edge cases
               - Error handling: failures surfaced rather than swallowed
               - Concurrency: data races, deadlocks, and lifetime issues

            2. **Security**
               - Potential security vulnerabilities
               - Input validation and sanitization
               - Authentication/authorization logic

            3. **Performance**
               - Potential performance bottlenecks
               - Unnecessary allocation, copying, or I/O in hot paths
               - Memory leaks or resource-handling issues

            4. **Testing**
               - Adequate coverage for the behaviour this PR changes
               - Test quality and edge cases
               - Missing test scenarios, especially regressions

            5. **Documentation**
               - Code is documented where the intent is not obvious
               - README/API docs updated for user-visible changes

            Review only the changes in this PR; do not review pre-existing code
            that this PR does not touch. Report what you can support with
            evidence from the diff, and say so plainly when you are uncertain
            rather than speculating.

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations or praise.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
