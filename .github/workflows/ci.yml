name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# New revisions replace obsolete runs of the same PR. Main pushes use their
# own run IDs so pending main validation is never evicted by another push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Change detection ──────────────────────────────────────────────────────
  # Documentation-only changes skip the build and test jobs below. Those jobs
  # are skipped by a job-level `if:`, which GitHub reports as a successful
  # check, so required checks still resolve. If this job fails, they all run.
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull_request checkout is the test merge commit, whose first
          # parent is the base branch tip.
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          base='HEAD^1'
          if [ "${EVENT_NAME}" = push ]; then
            base="${BEFORE_SHA}"
            git fetch --no-tags --depth=1 origin "${base}" || base=''
          fi

          # Anything unexpected (new branch, unreachable base) means "build".
          code=true
          if [ -n "${base}" ] &&
             changed="$(git diff --name-only --no-renames "${base}" HEAD)"; then
            code=false
            while IFS= read -r path; do
              [ -n "${path}" ] || continue
              case "${path}" in
                docs/*|.gc/*|CHANGELOG.md)
                  # Documentation, unless Rust code embeds it with
                  # include_str!/include_bytes! (as a test does with one doc).
                  if git grep -q -F -e 'include_' --and -e "${path}" -- \
                       src tests fuzz build.rs; then
                    code=true
                  fi
                  ;;
                *) code=true ;;
              esac
              [ "${code}" = false ] || break
            done <<< "${changed}"
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "Build and test jobs required: ${code}"

  # ── Security audit ─────────────────────────────────────────────────────────
  # Only `cargo audit`, so this required check fails for one reason: an
  # unaddressed RustSec advisory in Cargo.lock.
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # The fuzz harness is a workspace member, so the single root Cargo.lock
      # covers every dependency graph; exceptions live in .cargo/audit.toml.
      - name: Audit Cargo.lock
        run: cargo audit

  # ── Repository policy ─────────────────────────────────────────────────────
  # Packaging, dependency-update, toolchain, and backlog policy scripts. Keep
  # this out of the required checks: a broken docs anchor must not block a
  # security fix. It runs for documentation-only changes too.
  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test package compliance policies
        run: |
          build-aux/linux/test-package-compliance.sh
          scripts/test-macos-icon-bundle-policy.sh
          scripts/test-macos-package-policy.sh
          scripts/test-macos-rpath-batching.sh
          python3 scripts/test_build_helpers.py

      - name: Test dependency update policy
        run: |
          python3 scripts/test_dependency_update_policy.py
          python3 scripts/sync_rust_toolchain.py --check

      - name: Check backlog consistency
        # Read-only: unique record IDs, literal completion counters, internal
        # links/anchors. Never closes a parent record or assigns a worker.
        run: |
          python3 scripts/check_backlog_consistency.py
          python3 scripts/test_check_backlog_consistency.py
          python3 scripts/test_check_backlog_consistency_rework.py
          python3 scripts/test_check_backlog_consistency_rework2.py
          python3 scripts/test_check_backlog_consistency_rework3.py

  # ── MSRV (minimum supported Rust version) ─────────────────────────────────
  # Compile-proof for the `rust-version` declared in Cargo.toml. Keep the
  # toolchain pin below in lockstep with that field: the gtk-rs 0.11 release
  # series sets the current floor (rustc 1.94).
  msrv:
    # Keep this name stable across future Rust bumps. Deployment must migrate
    # GasCity's old "MSRV (1.92)" expectation and may then add "MSRV" to the
    # live ruleset; this repository change does not mutate either external gate.
    name: MSRV
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - name: Install system dependencies (Fedora)
        run: |
          dnf install -y gcc gtk4-devel libadwaita-devel \
            dbus-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            pkgconf-pkg-config git curl

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain (1.94)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.94.0
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: msrv-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: msrv-cargo-

      - name: Check (MSRV, --all-targets, --locked)
        run: cargo check --all-targets --locked

  # ── Desktop metadata (AppStream + desktop entry) ──────────────────────────
  # The packaging half of the global validation gate: these files ship in
  # every Linux package and were previously only validated by hand.
  desktop-metadata:
    name: Desktop Metadata
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils

      - name: Validate desktop entry
        run: |
          if ! diagnostics="$(desktop-file-validate data/io.github.tributary.Tributary.desktop 2>&1)"; then
            printf '%s\n' "$diagnostics"
            exit 1
          fi
          if [ -n "$diagnostics" ]; then
            printf '%s\n' "$diagnostics"
            exit 1
          fi

      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net data/io.github.tributary.Tributary.metainfo.xml

  # ── Linux (native binary + test) ──────────────────────────────────────────
  build-linux:
    name: Linux (${{ matrix.arch }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:44
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install system dependencies (Fedora)
        run: |
          dnf install -y binutils gcc gcc-c++ gtk4-devel libadwaita-devel \
            dbus-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            gstreamer1-plugins-good gstreamer1-plugins-bad-free gstreamer1-plugins-ugly-free gstreamer1-libav \
            pkgconf-pkg-config git curl

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-${{ matrix.arch }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (debug, --all-targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (release)
        run: cargo clippy --release -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Validate Linux binary payload
        run: build-aux/linux/validate-package-compliance.sh --elf target/release/tributary

      - name: Run tests
        run: cargo test --release

      # Debug-profile tests catch what release-only testing ships past:
      # debug_assert! bodies and overflow checks are compiled out above.
      - name: Run tests (debug, --all-targets)
        if: matrix.arch == 'x86_64'
        run: cargo test --all-targets

      # The fuzz harness is a non-default workspace member: `cargo fmt` above
      # already covers it, but the clippy passes do not.
      - name: Clippy (fuzz harness)
        if: matrix.arch == 'x86_64'
        run: cargo clippy -p tributary-fuzz --all-targets --locked -- -D warnings

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: tributary-linux-${{ matrix.arch }}
          path: target/release/tributary
          if-no-files-found: error

  # ── Real-display GTK production-widget gate (Linux x86_64) ────────────────
  # Every other job runs headless, where the crate's GTK widget contracts
  # silently skip (no X/Wayland socket, GTK cannot initialize). This job gives
  # them a real X display and runs them in fail-on-skip mode, so a skipped
  # widget body can never masquerade as a pass. GTK is exercised on the single
  # thread that initializes it; see `src/ui/mod.rs::widget_test_session`.
  gtk-display-gate:
    name: GTK Display Gate (Linux x86_64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - name: Install system dependencies (Fedora)
        run: |
          dnf install -y gcc gcc-c++ gtk4-devel libadwaita-devel \
            dbus-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            pkgconf-pkg-config git curl xorg-x11-server-Xvfb

      - uses: actions/checkout@v7
        with:
          # The job body runs cargo (and thus third-party build scripts)
          # inside a container; it never needs Git credentials. Dropping the
          # persisted token closes the artipacked credential-exposure finding
          # on this checkout.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: gtk-gate-cargo-${{ hashFiles('Cargo.lock') }}
          # No restore-keys fallback here: a literal "keyword: value" line
          # (e.g. restore-keys: gtk-gate-cargo-) triggers Codacy's gitleaks
          # generic-api-key secret detection on newly added lines. The exact
          # hashFiles key above keeps hits stable while Cargo.lock is
          # unchanged; a lockfile bump simply rebuilds from a cold cache.

      - name: Run production GTK widget contracts on one real display
        shell: bash
        env:
          # Turn a would-be display skip into a hard failure.
          TRIBUTARY_GTK_GATE: require
          GDK_BACKEND: x11
          # Xvfb has no GPU, and GL/Vulkan probing is slow and flaky here.
          GSK_RENDERER: cairo
          # Keep the harness output plain so the checks below can match it.
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail

          scratch="${RUNNER_TEMP:-${TMPDIR:-/var/tmp}}"
          log="${scratch}/gtk-display-gate.log"
          runtime="${scratch}/gtk-runtime"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          export XDG_RUNTIME_DIR="$runtime"

          rc=0
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            cargo test --bin tributary \
              ui::browser::tests::gtk_widget_contracts_hold_on_one_session \
              -- --exact --nocapture >"$log" 2>&1 || rc=$?
          cat "$log"

          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo test exited $rc under the real-display GTK gate"
            exit 1
          fi
          if ! grep -Eq 'gtk_widget_contracts_hold_on_one_session \.\.\. ok' "$log"; then
            echo "::error::the production GTK widget contract never reported ok; it was skipped or filtered out"
            exit 1
          fi
          if grep -q 'skipping' "$log"; then
            echo "::error::a GTK contract skipped even though TRIBUTARY_GTK_GATE=require"
            exit 1
          fi

  # ── Representative line coverage + ratchet (Linux x86_64) ────────────────
  # This is deliberately a separate, exactly pinned aggregate. Native jobs
  # remain responsible for compiling and testing platform-only code, but they
  # cannot produce one comparable cross-platform percentage.
  coverage:
    name: Coverage (Linux x86_64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - name: Install system dependencies (Fedora)
        run: |
          dnf install -y gcc gcc-c++ gtk4-devel libadwaita-devel \
            dbus-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            gstreamer1-plugins-good gstreamer1-plugins-bad-free gstreamer1-plugins-ugly-free gstreamer1-libav \
            pkgconf-pkg-config git curl

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned coverage toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: coverage-1.94.0-llvm-cov-0.8.7-${{ hashFiles('Cargo.lock') }}
          restore-keys: coverage-1.94.0-llvm-cov-0.8.7-

      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Run comprehensive coverage gate
        run: |
          minimum="$(tr -d '[:space:]' < coverage-baseline.txt)"
          cargo llvm-cov clean --workspace
          coverage_status=0
          cargo llvm-cov --all-targets --all-features --locked --html --output-dir coverage --fail-under-lines "$minimum" || coverage_status=$?
          cargo llvm-cov report --summary-only
          exit "$coverage_status"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux-x86_64
          path: coverage/
          if-no-files-found: error

  # ── macOS (.app + .dmg) ───────────────────────────────────────────────────
  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            rust_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies (Homebrew)
        run: |
          brew update
          brew install gtk4 libadwaita pkg-config create-dmg \
            gstreamer gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav \
            adwaita-icon-theme

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-${{ matrix.arch }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (debug, --all-targets)
        run: |
          BREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="${BREW_PREFIX}/lib/pkgconfig"
          cargo clippy --all-targets --target ${{ matrix.rust_target }} -- -D warnings

      - name: Clippy (release)
        run: |
          BREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="${BREW_PREFIX}/lib/pkgconfig"
          cargo clippy --release --target ${{ matrix.rust_target }} -- -D warnings

      - name: Build (release)
        run: |
          BREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="${BREW_PREFIX}/lib/pkgconfig"
          cargo build --release --target ${{ matrix.rust_target }}

      - name: Run tests
        run: |
          BREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="${BREW_PREFIX}/lib/pkgconfig"
          cargo test --release --target ${{ matrix.rust_target }}

      - name: Create .app bundle and .dmg
        # Production must pin the repository policy and platform inspectors,
        # ignoring the helper's deliberately injectable test hooks.
        env:
          # Reuse the target-specific release build above when the packaging
          # helper verifies it, instead of compiling a second host-layout tree.
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
          TRIBUTARY_FORBIDDEN_COMPONENTS_FILE: /dev/null
          MACOS_FIND_COMMAND: /usr/bin/true
          MACOS_OTOOL_COMMAND: /usr/bin/false
          MACOS_OD_COMMAND: /usr/bin/false
        run: |
          # Copy the target-specific binary to the default location expected by build-macos.sh
          mkdir -p target/release
          cp target/${{ matrix.rust_target }}/release/tributary target/release/tributary
          bash scripts/build-macos.sh --dmg

      - name: Upload .dmg
        uses: actions/upload-artifact@v7
        with:
          name: tributary-macos-${{ matrix.arch }}
          path: dist/Tributary.dmg
          if-no-files-found: error

  # ── Windows (.zip DLL bundle) ─────────────────────────────────────────────
  build-windows:
    name: Windows (${{ matrix.arch }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.runner }}
    # Cap the job so a hung MSYS2 mirror fails fast and re-runs instead of
    # stalling to the 6-hour ceiling (as one CLANGARM64 run did).
    timeout-minutes: 45
    strategy:
      # Preserve the independent result from each architecture when a runner,
      # package mirror, or platform-specific test fails on the other one.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            msystem: CLANG64
            pkg_prefix: mingw-w64-clang-x86_64
            rust_target: x86_64-pc-windows-gnullvm
            msys_env: clang64
          - arch: aarch64
            runner: windows-11-arm
            msystem: CLANGARM64
            pkg_prefix: mingw-w64-clang-aarch64
            rust_target: aarch64-pc-windows-gnullvm
            msys_env: clangarm64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parse bundler with Windows PowerShell 5.1
        if: matrix.arch == 'x86_64'
        shell: powershell
        run: |
          $parseTokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/build-windows.ps1').Path,
            [ref]$parseTokens,
            [ref]$parseErrors
          )
          if (@($parseErrors).Count -gt 0) {
            foreach ($parseError in @($parseErrors)) {
              Write-Error $parseError.Message
            }
            exit 1
          }

      - name: Set up MSYS2 (${{ matrix.msystem }})
        uses: msys2/setup-msys2@v2.32.0
        env:
          # Pin pacman to the canonical Cloudflare CDN (repo.msys2.org) instead of
          # the flaky secondary mirrors (ftp2.osuosl.org, mirror.msys2.org) that
          # stall on the slow windows-11-arm runner and trip pacman's "Operation
          # too slow" abort, failing the whole transaction. setup-msys2 #571/#577.
          __SETUP_MSYS2_USE_MAIN_MIRROR_ONLY: 'true'
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          # setup-msys2's optional package-cache cleanup intermittently fails
          # at its paccache step on windows-11-arm after installation succeeds.
          # Cargo keeps its separate cache below; only skip the flaky MSYS2
          # package cache on that runner.
          cache: ${{ matrix.arch != 'aarch64' }}
          install: >-
            ${{ matrix.pkg_prefix }}-gtk4
            ${{ matrix.pkg_prefix }}-libadwaita
            ${{ matrix.pkg_prefix }}-gstreamer
            ${{ matrix.pkg_prefix }}-gst-plugins-good
            ${{ matrix.pkg_prefix }}-gst-plugins-bad
            ${{ matrix.pkg_prefix }}-gst-plugins-ugly
            ${{ matrix.pkg_prefix }}-gst-libav
            ${{ matrix.pkg_prefix }}-pkg-config
            ${{ matrix.pkg_prefix }}-toolchain

      - name: Install Rust (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-${{ matrix.arch }}-cargo-

      # Run fmt unconditionally — it's sub-second and fails fast, so a
      # fmt-broken commit short-circuits the slow ARM64 runner before
      # any compile work happens.
      - name: Check formatting
        run: cargo fmt --check

      # Heavier strict-lint passes only on x86_64 — the windows-11-arm
      # runner is materially slower than the rest, so we skip the extra
      # clippy passes and the cargo-test step there. ARM64 still gets a
      # build to confirm cross-compile health and produces a release
      # artifact.
      - name: Clippy (debug, --all-targets)
        if: matrix.arch == 'x86_64'
        run: |
          export PKG_CONFIG_ALLOW_CROSS="1"
          export PKG_CONFIG_PATH="/${{ matrix.msys_env }}/lib/pkgconfig"
          cargo clippy --all-targets --target ${{ matrix.rust_target }} -- -D warnings

      - name: Clippy (release)
        if: matrix.arch == 'x86_64'
        run: |
          export PKG_CONFIG_ALLOW_CROSS="1"
          export PKG_CONFIG_PATH="/${{ matrix.msys_env }}/lib/pkgconfig"
          cargo clippy --release --target ${{ matrix.rust_target }} -- -D warnings

      - name: Clippy (release, ARM64-only fast path)
        if: matrix.arch == 'aarch64'
        run: |
          export PKG_CONFIG_ALLOW_CROSS="1"
          export PKG_CONFIG_PATH="/${{ matrix.msys_env }}/lib/pkgconfig"
          cargo clippy --release --target ${{ matrix.rust_target }} -- -D warnings

      - name: Build (release)
        run: |
          export PKG_CONFIG_ALLOW_CROSS="1"
          export PKG_CONFIG_PATH="/${{ matrix.msys_env }}/lib/pkgconfig"
          cargo build --release --target ${{ matrix.rust_target }}

      - name: Run tests
        if: matrix.arch == 'x86_64'
        run: |
          export PKG_CONFIG_ALLOW_CROSS="1"
          export PKG_CONFIG_PATH="/${{ matrix.msys_env }}/lib/pkgconfig"
          cargo test --release --target ${{ matrix.rust_target }}

      - name: Bundle DLLs, validate app resources, and create zip
        run: |
          MSYS_ROOT=$(cygpath -w /)
          pwsh -File scripts/build-windows.ps1 -Msys2Root "$MSYS_ROOT" -NoCargoBuild
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          MSYS_ENV: ${{ matrix.msys_env }}

      - name: Upload Windows zip
        uses: actions/upload-artifact@v7
        with:
          name: tributary-windows-${{ matrix.arch }}
          path: dist/tributary-windows.zip
          if-no-files-found: error

  # ── Flatpak ───────────────────────────────────────────────────────────────
  build-flatpak:
    name: Flatpak (Linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test Flatpak permission policy
        run: build-aux/flatpak/test-permissions.sh

      - name: Test Linux package compliance policy
        run: |
          command -v ostree
          command -v readelf
          build-aux/linux/test-package-compliance.sh

      - name: Install Python dependencies
        run: |
          python3 -m pip install --requirement build-aux/flatpak/generator-requirements.txt \
            --break-system-packages \
            || python3 -m pip install --requirement build-aux/flatpak/generator-requirements.txt

      - name: Generate cargo-sources.json
        run: bash build-aux/flatpak/generate-cargo-sources.sh

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: tributary.flatpak
          manifest-path: build-aux/flatpak/io.github.tributary.Tributary.yml
          cache-key: flatpak-${{ hashFiles('**/Cargo.lock') }}
          upload-artifact: false

      - name: Validate completed Flatpak bundle payload
        run: build-aux/flatpak/validate-bundle-compliance.sh tributary.flatpak

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: tributary-flatpak
          path: tributary.flatpak
          if-no-files-found: error

  # ── Documentation-only stand-ins ──────────────────────────────────────────
  # A matrix job skipped by a job-level `if:` reports a single check without
  # its matrix suffix, so the required per-platform contexts such as
  # "Linux (x86_64)" would never arrive on a documentation-only change. This
  # job reports those exact names, and runs only when the builds were skipped.
  # Keep the list in step with the build matrices above.
  docs-only-platforms:
    name: ${{ matrix.check }}
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        check:
          - Linux (x86_64)
          - Linux (aarch64)
          - macOS (aarch64)
          - Windows (x86_64)
          - Windows (aarch64)
    steps:
      - name: Report the skipped native build
        run: echo "Only documentation changed; the native build and tests were skipped."

  # ── SHA256 Checksums ───────────────────────────────────────────────────────
  checksums:
    name: SHA256 Checksums
    runs-on: ubuntu-24.04
    needs: [changes, build-linux, build-macos, build-windows, build-flatpak]
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          find . -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.flatpak' -o -name 'tributary' \) \
            -exec sha256sum {} + | sed 's|  \./|  |' | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: SHA256SUMS.txt
          if-no-files-found: warn
