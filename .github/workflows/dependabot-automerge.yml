name: Dependabot auto-merge

# Auto-merge clean (patch + minor) Dependabot PRs once CI is green.
#
# How the pieces fit together:
#   * This workflow only ENABLES GitHub's native auto-merge on the PR.
#   * The actual gate ("wait for configured required checks") is enforced by
#     the live branch ruleset on `main`, not by this file. Native auto-merge
#     waits only on the checks that ruleset marks required, so before the
#     writer enables auto-merge it reads the active rulesets for `main` and
#     verifies they require the COMPLETE policy check set (every hosted CI
#     job, CodeQL, Codacy, CodeRabbit, and the repo-owned Bot Review Gate).
#     Until the live ruleset enforces that full set — including `MSRV` — the
#     writer refuses and routine Dependabot auto-merge stays off. The exact
#     rollout and verification steps are documented in
#     docs/dependency-updates.md.
#   * Majors are NOT auto-merged: they fall through the update-type guard below
#     and wait for coordinated repair and review.
#   * Rust compiler/MSRV and rust-toolchain action-code proposals are NOT
#     auto-merged. Dependabot still opens them; the compiler repair lane
#     synchronizes every authoritative version and requires full CI first.
#
# Security: uses `pull_request` (NOT `pull_request_target`) and never checks out
# the PR head. A read-only first job binds changed-file inspection and metadata
# extraction to the event's exact head SHA. The action-free write job checks
# that SHA again immediately before an exact-head-guarded merge request.
on:
  pull_request:
    paths-ignore:
      - ".github/workflows/dependabot-automerge.yml"

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect_changed_files:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'jm2/tributary'
    permissions:
      pull-requests: read
    outputs:
      privileged_workflow_unchanged: ${{ steps.changed_files.outputs.safe }}
      inspected_head_sha: ${{ steps.metadata_head.outputs.head_sha }}
      dependency_names: ${{ steps.meta.outputs.dependency-names }}
      package_ecosystem: ${{ steps.meta.outputs.package-ecosystem }}
      update_type: ${{ steps.meta.outputs.update-type }}
    steps:
      # Inline and API-only by design: no proposed third-party action executes
      # before the complete changed-file set has been proven safe.
      - name: Deny privileged workflow changes
        id: changed_files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          pr_api="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          changed_file_list="${RUNNER_TEMP}/dependabot-changed-files.txt"

          observed_head_before="$(gh api "${pr_api}" --jq '.head.sha')"
          if [ "${observed_head_before}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "PR head changed before file inspection; refusing write access." >&2
            exit 1
          fi

          gh api --paginate \
            "${pr_api}/files?per_page=100" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' \
            > "${changed_file_list}"

          observed_head_after="$(gh api "${pr_api}" --jq '.head.sha')"
          if [ "${observed_head_after}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "PR head changed during file inspection; refusing write access." >&2
            exit 1
          fi

          observed_changed_files="$(wc -l < "${changed_file_list}")"
          if [ "${observed_changed_files}" -ne "${EXPECTED_CHANGED_FILES}" ]; then
            echo "Changed-file enumeration was incomplete; refusing write access." >&2
            exit 1
          fi

          safe=true
          while IFS=$'\t' read -r filename previous_filename; do
            if [ "${filename}" = '.github/workflows/dependabot-automerge.yml' ] ||
               [ "${previous_filename}" = '.github/workflows/dependabot-automerge.yml' ]; then
              safe=false
              break
            fi
          done < "${changed_file_list}"

          echo "safe=${safe}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${EXPECTED_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Revalidate exact head before metadata
        id: pre_metadata_head
        if: steps.changed_files.outputs.safe == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ steps.changed_files.outputs.head_sha }}
        run: |
          set -euo pipefail
          observed_head="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.head.sha')"
          if [ "${observed_head}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "PR head changed before metadata extraction; refusing." >&2
            exit 1
          fi
          echo "matches=true" >> "${GITHUB_OUTPUT}"

      - name: Fetch Dependabot metadata
        id: meta
        if: steps.pre_metadata_head.outputs.matches == 'true'
        # v3, pinned to the full commit published in GitHub's current example.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Revalidate exact head after metadata
        id: metadata_head
        if: steps.meta.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ steps.changed_files.outputs.head_sha }}
        run: |
          set -euo pipefail
          observed_head="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.head.sha')"
          if [ "${observed_head}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "PR head changed during metadata extraction; refusing." >&2
            exit 1
          fi
          echo "head_sha=${EXPECTED_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  dependabot-automerge:
    needs: inspect_changed_files
    runs-on: ubuntu-latest
    if: |
      needs.inspect_changed_files.outputs.privileged_workflow_unchanged == 'true' &&
      needs.inspect_changed_files.outputs.inspected_head_sha == github.event.pull_request.head.sha &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'jm2/tributary' &&
      needs.inspect_changed_files.outputs.package_ecosystem != 'rust-toolchain' &&
      !contains(needs.inspect_changed_files.outputs.dependency_names, 'dtolnay/rust-toolchain') &&
      !contains(needs.inspect_changed_files.outputs.dependency_names, 'dependabot/fetch-metadata') &&
      (
        needs.inspect_changed_files.outputs.update_type == 'version-update:semver-patch' ||
        needs.inspect_changed_files.outputs.update_type == 'version-update:semver-minor'
      )
    permissions:
      administration: read
      contents: write
      pull-requests: write
    steps:
      # Major bumps, compiler/MSRV proposals, rust-toolchain action-code
      # proposals, and metadata-action self-updates never reach this writer.
      - name: Require the live ruleset to enforce the full policy gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Native auto-merge waits only on the checks the live main ruleset
          # marks required. Until that set covers the complete all-green
          # policy, a dependency PR could land while Coverage, CodeQL, Codacy,
          # CodeRabbit, Windows (aarch64), or a bot review is still pending or
          # failing. Read every active ruleset that applies to main and refuse
          # auto-merge until each policy context below is required with its
          # expected app binding ("15368" GitHub Actions, "57789" GitHub
          # Advanced Security/CodeQL, "56611" Codacy, empty = unbound commit
          # status context). Fail closed: a query failure or coverage gap
          # keeps routine auto-merge off.
          expected_checks=(
            "Security Audit|15368"
            "Linux (x86_64)|15368"
            "Linux (aarch64)|15368"
            "macOS (aarch64)|15368"
            "Windows (x86_64)|15368"
            "Windows (aarch64)|15368"
            "Flatpak (Linux)|15368"
            "MSRV|15368"
            "Coverage (Linux x86_64)|15368"
            "Bot Review Gate|15368"
            "CodeQL|57789"
            "Analyze (python)|57789"
            "Analyze (rust)|57789"
            "Analyze (actions)|57789"
            "Codacy Static Code Analysis|56611"
            "CodeRabbit|"
          )
          summary_file="${RUNNER_TEMP}/main-rulesets.json"
          required_contexts="${RUNNER_TEMP}/required-contexts.txt"
          : > "${required_contexts}"
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/rulesets?ref=main" \
            > "${summary_file}"; then
            echo "Unable to read repository rulesets; refusing auto-merge." >&2
            exit 1
          fi
          rule_ids="$(jq -r '.[] | select(.enforcement == "active") | .id' "${summary_file}")"
          if [ -z "${rule_ids}" ]; then
            echo "No active ruleset applies to main; refusing auto-merge." >&2
            exit 1
          fi
          # The list endpoint omits rule parameters, so each active ruleset
          # must be fetched individually.
          for rule_id in ${rule_ids}; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/rulesets/${rule_id}" \
              > "${RUNNER_TEMP}/ruleset-${rule_id}.json"; then
              echo "Unable to read ruleset ${rule_id}; refusing auto-merge." >&2
              exit 1
            fi
            jq -r '.rules[]?
              | select(.type == "required_status_checks")
              | .parameters.required_status_checks[]
              | "\(.context)|\(.integration_id // "")"' \
              "${RUNNER_TEMP}/ruleset-${rule_id}.json" >> "${required_contexts}"
          done
          sort -u -o "${required_contexts}" "${required_contexts}"
          unmet=0
          for expected in "${expected_checks[@]}"; do
            app_id="${expected##*|}"
            if ! grep -Fxq "${expected}" "${required_contexts}"; then
              echo >&2 "main ruleset does not yet require '${expected%%|*}' (expected app binding: ${app_id:-unbound})"
              unmet=1
            fi
          done
          if [ "${unmet}" -ne 0 ]; then
            echo >&2 "Refusing to enable auto-merge: the live main ruleset does not yet enforce the full policy check set."
            exit 1
          fi

      - name: Enable exact-head auto-merge for patch & minor updates
        shell: bash
        run: |
          set -euo pipefail
          pr_api="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          observed_head="$(gh api "${pr_api}" --jq '.head.sha')"
          if [ "${observed_head}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "PR head changed before guarded merge; refusing auto-merge." >&2
            exit 1
          fi
          gh pr merge \
            --auto \
            --squash \
            --match-head-commit "${EXPECTED_HEAD_SHA}" \
            "${PR_URL}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ needs.inspect_changed_files.outputs.inspected_head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
