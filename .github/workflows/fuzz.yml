name: Fuzz
on:
  schedule:
    # Run weekly on Sunday at 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fuzz:
    name: Fuzz Targets
    runs-on: ubuntu-24.04
    # The fuzz crate depends on the full `tributary` library, so this builds
    # and ASAN-instruments the entire dependency tree (GTK4, GStreamer,
    # SeaORM, aws-lc-sys, ...) with codegen-units=1 from a cold cache before
    # the bounded fuzz runs. Allow generous headroom for that compile.
    timeout-minutes: 60
    container:
      image: fedora:44
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ gtk4-devel libadwaita-devel \
            dbus-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            pkgconf-pkg-config git curl
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: fuzz-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: fuzz-cargo-
      - name: Cache fuzz corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Install Rust nightly (required for cargo-fuzz)
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz every target (bounded)
        env:
          # The fuzz crate shares the root release profile, whose LTO and
          # symbol stripping are for shipped binaries; turn both off so
          # sanitizer reports stay symbolized.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_STRIP: "false"
        # Each target starts from its committed seeds plus the cached corpus
        # and stops at the first of its run or time bounds; a target never
        # runs unbounded. Every target runs even after another crashes, and
        # the step fails if any did (its reproducer is in fuzz/artifacts/).
        run: |
          failed=0
          for source in fuzz/fuzz_targets/*.rs; do
            target="$(basename "$source" .rs)"
            mkdir -p "fuzz/corpus/$target"
            echo "::group::$target"
            if ! cargo fuzz run "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" -- \
                -runs=2000000 -max_total_time=60 -timeout=10 \
                -rss_limit_mb=2048 -max_len=65536; then
              echo "::error::$target crashed; the reproducer is in the fuzz-artifacts upload"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
