# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# NOTE: dependabot.yml itself CANNOT auto-merge anything. The `groups:` blocks
# below only control how updates are BATCHED into pull requests. Auto-merge of
# clean semver-patch bumps is handled separately by
# .github/workflows/dependabot-automerge.yml together with a status-check
# ruleset on `main` (see that workflow's header).
#
# `cooldown` delays opening update PRs until a few days after a release, giving
# bad/yanked releases time to be pulled before they can be auto-merged.

version: 2
updates:
  # ── Rust crates (Cargo.toml / Cargo.lock) ─────────────────────────────────
  #
  # The fuzz harness is a member of the root workspace, so this one entry and
  # the single root Cargo.lock cover it.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      # SeaORM's runtime and migration crates are one compatibility surface.
      # Keep every update level in one PR. Repository policy tests also require
      # their manifest requirements and resolved versions to remain paired.
      seaorm:
        applies-to: version-updates
        patterns:
          - "sea-orm"
          - "sea-orm-migration"
      seaorm-security:
        applies-to: security-updates
        patterns:
          - "sea-orm"
          - "sea-orm-migration"

      # One PR for all patch and minor crate bumps. Majors are deliberately
      # EXCLUDED so each major arrives as its own PR for human review. The
      # auto-merge workflow merges this group only when every bump in it is a
      # patch; any minor (breaking for a 0.x crate) leaves it for review.
      cargo-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "sea-orm"
          - "sea-orm-migration"
        update-types:
          - "minor"
          - "patch"

  # ── Rust compiler floor (.github/rust-toolchain.toml) ────────────────────
  # Compiler proposals are isolated from action-implementation updates and
  # never auto-merge. The repair lane synchronizes Cargo.toml, CI, and README
  # before the full native and packaging matrix decides feasibility.
  - package-ecosystem: "rust-toolchain"
    directory: "/.github"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1

  # ── GitHub Actions (the `uses:` pins in .github/workflows/*) ───────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      # The exact digest-pinned refs track the action implementation on its
      # permanent master history, independently from the compiler floor.
      # Action-code proposals require manual review and never auto-merge.
      rust-toolchain:
        applies-to: version-updates
        patterns:
          - "dtolnay/rust-toolchain"

      # Updating the privileged metadata action must be an isolated,
      # review-only PR. The workflow's read-only preflight denies any PR that
      # changes its own file, so a proposed ref cannot execute before review.
      dependabot-metadata:
        applies-to: version-updates
        patterns:
          - "dependabot/fetch-metadata"
      dependabot-metadata-security:
        applies-to: security-updates
        patterns:
          - "dependabot/fetch-metadata"

      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "dtolnay/rust-toolchain"
          - "dependabot/fetch-metadata"
        update-types:
          - "minor"
          - "patch"
