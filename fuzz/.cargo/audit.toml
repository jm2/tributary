# cargo-audit configuration for the independent fuzz workspace
# https://docs.rs/cargo-audit/latest/cargo_audit/config/
#
# The fuzz crate is its own Cargo workspace and owns `fuzz/Cargo.lock`. It is a
# separate dependency graph, so it gets its own audit boundary and its own
# scoped advisory exceptions. `scripts/audit_lockfiles.py` audits this graph by
# running cargo-audit from this directory with this lockfile, and it refuses to
# let an exception granted to the root graph suppress a finding here (and vice
# versa). Root/fuzz lock coherence (`scripts/sync_fuzz_lock.py`) proves shared
# production-direct versions match; it is not a security audit of this graph.

[advisories]
# rkyv 0.7.46 — out-of-bounds reads during archive access (RUSTSEC-2026-0235)
# Independently re-verified for the fuzz graph on 2026-09-17: `cargo tree
# --locked -i rkyv` is empty in `fuzz/`, so this optional package is retained in
# `fuzz/Cargo.lock` but not activated. SeaORM's default Decimal support keeps
# rust_decimal and its optional rkyv 0.7 integration in the lock, and the fuzz
# workspace enables neither rust_decimal's `rkyv` feature nor any direct rkyv
# use. cargo-audit nevertheless checks every locked optional package. The
# advisory is fixed only in rkyv 0.8.17+, while current rust_decimal still
# declares optional rkyv 0.7.
# Re-review by 2026-12-01 or before the next release, whichever comes first,
# and immediately before enabling rkyv serialization or exposing Decimal
# archive input.
ignore = ["RUSTSEC-2026-0235"]
